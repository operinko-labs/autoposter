services:
  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_USER: autoposter
      POSTGRES_PASSWORD: autoposter
      POSTGRES_DB: autoposter
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoposter"]
      interval: 2s
      timeout: 3s
      retries: 20
