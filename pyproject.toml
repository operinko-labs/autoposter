[project]
name = "autoposter"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    # 4.16 rather than 4.15: LogoMixin -- uploadLogo/lockLogo/logos/deleteLogo,
    # the clearlogo target artwork_modes/logo.py writes to -- arrived in 4.16.0
    # ("Add image tags and movie/show logos"). On 4.15 the logo modes would fail
    # with AttributeError against a real server. Pinned as a contract in
    # tests/test_plexapi_logo_contract.py.
    "plexapi>=4.16",
    "prometheus-client>=0.21",
    "requests>=2.31",
    # Badge rendering and the EXIF provenance reader. Imported at module scope
    # by render/pipeline.py, so a missing Pillow stops the service starting --
    # which is exactly what happened in the built image, because it was only
    # ever present in developers' environments.
    "pillow>=11.0",
    # Imported directly by app.py. It arrives transitively via fastapi, but a
    # module this codebase imports itself belongs in its own dependency list.
    "starlette>=0.40",
    # Password hashing for the Web UI's API (api/auth.py).
    "bcrypt>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Parallel runs, which are safe only because tests/conftest.py hands each
    # worker a database of its own -- see `_database_for_this_process` there.
    # CI passes `-n auto`; the documented local command stays serial, because a
    # development box is already sharing its cores with an editor, the API
    # container and the vite server.
    "pytest-xdist>=3.6",
    "ruff>=0.8",
    # tests/test_badge_parity.py compares rendered regions numerically.
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoposter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `imagemagick` is both the gate and the selector. tests/conftest.py's
# `imagemagick` fixture turns a missing binary into a skip locally and a
# failure under CI, and .forgejo/workflows/ci.yml deselects these from the
# main run (`-m "not imagemagick"`) so a dedicated step can run them where a
# Q16-HDRI build exists. Registering it here keeps a typo'd marker from
# quietly meaning "unmarked".
markers = [
    'imagemagick: needs a real `magick` binary; pass "hdri" when byte-exact parity requires a Q16-HDRI build',
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Select explicitly rather than inheriting ruff's defaults. Those defaults
# changed between 0.15 and 0.16, so an unpinned ruff turned a green local run
# into 127 CI failures on identical code. A linter's default rule set is not a
# stable contract; this is. Broadening it is a deliberate change, made once,
# with the resulting fixes reviewed -- not something a dependency resolver
# should decide on our behalf.
select = ["E4", "E7", "E9", "F"]
