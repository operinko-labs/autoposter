[project]
name = "autoposter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "plexapi>=4.15",
    "prometheus-client>=0.21",
    "requests>=2.31",
    # Badge rendering and the EXIF provenance reader. Imported at module scope
    # by render/pipeline.py, so a missing Pillow stops the service starting --
    # which is exactly what happened in the built image, because it was only
    # ever present in developers' environments.
    "pillow>=11.0",
    # Imported directly by app.py. It arrives transitively via fastapi, but a
    # module this codebase imports itself belongs in its own dependency list.
    "starlette>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoposter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
