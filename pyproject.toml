[project]
name = "autoposter"
version = "0.2.0"
license = "GPL-3.0-only"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    # 4.16 rather than 4.15: LogoMixin -- uploadLogo/lockLogo/logos/deleteLogo,
    # the clearlogo target artwork_modes/logo.py writes to -- arrived in 4.16.0
    # ("Add image tags and movie/show logos"). On 4.15 the logo modes would fail
    # with AttributeError against a real server. Pinned as a contract in
    # tests/test_plexapi_logo_contract.py.
    "plexapi>=4.16",
    "prometheus-client>=0.21",
    "requests>=2.31",
    # Badge rendering and the EXIF provenance reader. Imported at module scope
    # by render/pipeline.py, so a missing Pillow stops the service starting --
    # which is exactly what happened in the built image, because it was only
    # ever present in developers' environments.
    "pillow>=11.0",
    # Imported directly by app.py. It arrives transitively via fastapi, but a
    # module this codebase imports itself belongs in its own dependency list.
    "starlette>=0.40",
    # Starlette's form parser imports it at REQUEST time (starlette/formparsers.py
    # sets `multipart = None` when it is absent), so an undeclared upload route
    # answers 500 on its first real multipart request with every test green --
    # the Pillow failure again, one layer further out. Floored at 0.0.20 for two
    # reasons: 0.0.18 fixed the malformed-multipart logging DoS, and by 0.0.12
    # the canonical module name is `python_multipart`, which is the import
    # Starlette tries first.
    "python-multipart>=0.0.20",
    # Password hashing for the Web UI's API (api/auth.py).
    "bcrypt>=4.2",
    # The ISO 639 reduction behind `plex_search`'s audio_language/
    # subtitle_language expansion. Kometa's own dependency, used the same way
    # (`Language.get(value).language`, modules/plex.py:141-151): a written `es`
    # has to be expanded against every locale variant the library carries, and
    # the reduction that decides which values match is a ~184-row ISO 639-2 to
    # 639-1 table. Added rather than transcribed because a hand-copied map that
    # is 95% right produces a language collection that is full and wrong --
    # precisely the failure mode phase 9b exists to prevent. Pure python, no
    # C extension, and as of 3.5 no required transitive dependencies at all
    # (`language-data` became the optional `[data]` extra, which nothing here
    # needs -- the tag reduction is parsing, not lookup).
    "langcodes>=3.5",
    # The W/WU/WL modifiers in the <<variable>> grammar (probe section 2.3)
    # spell an integer out as words. Pure python, no C extension.
    "num2words>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Parallel runs, which are safe only because tests/conftest.py hands each
    # worker a database of its own -- see `_database_for_this_process` there.
    # CI passes `-n auto`; the documented local command stays serial, because a
    # development box is already sharing its cores with an editor, the API
    # container and the vite server.
    "pytest-xdist>=3.6",
    "ruff>=0.8",
    # tests/test_badge_parity.py compares rendered regions numerically.
    "numpy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoposter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `imagemagick` is both the gate and the selector. tests/conftest.py's
# `imagemagick` fixture turns a missing binary into a skip locally and a
# failure under CI, and .forgejo/workflows/ci.yml deselects these from the
# main run (`-m "not imagemagick"`) so a dedicated step can run them where a
# Q16-HDRI build exists. Registering it here keeps a typo'd marker from
# quietly meaning "unmarked".
# `deep` is applied by tests/conftest.py's `pytest_collection_modifyitems` to
# every test in its DEEP_SUITES list, not written in the test files themselves.
# Registering it here is what keeps a typo in the workflow's `-m` expression
# from quietly meaning "nothing was deselected" -- the failure this lane most
# needs to be loud about is the opposite one, a pull request that reports green
# having run less than it should.
markers = [
    'imagemagick: needs a real `magick` binary; pass "hdri" when byte-exact parity requires a Q16-HDRI build',
    "deep: an ASGI-plus-database integration suite, deselected on pull requests and run in full on main; see DEEP_SUITES in tests/conftest.py",
    "jellyfin: needs a live Jellyfin 12.x at AUTOPOSTER_TEST_JELLYFIN_URL with AUTOPOSTER_TEST_JELLYFIN_APIKEY; skipped without them, deselected in CI",
]
# Pillow deprecations otherwise sit unnoticed among "N warnings" until the
# removal release breaks the suite outright. Fail on one now so a future
# Pillow bump surfaces here instead of whispering.
# Matched on message rather than module: Pillow's `deprecate()` helper warns
# with stacklevel=3, which attributes the warning to the *caller's* module
# (this test file), not to `PIL` -- so a `module="PIL"` filter never matches,
# verified empirically before choosing this form.
filterwarnings = [
    "error:.*is deprecated and will be removed in Pillow.*:DeprecationWarning",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Select explicitly rather than inheriting ruff's defaults. Those defaults
# changed between 0.15 and 0.16, so an unpinned ruff turned a green local run
# into 127 CI failures on identical code. A linter's default rule set is not a
# stable contract; this is. Broadening it is a deliberate change, made once,
# with the resulting fixes reviewed -- not something a dependency resolver
# should decide on our behalf.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# test_config_safety.py imports and re-exports test_api_config_editor's
# fixtures rather than rebuilding them, so the two files cannot drift about
# what a deployment looks like. Every fixture name is then repeated as a test
# function parameter -- the normal pytest dependency-injection shape -- which
# ruff reads as redefining an unused import.
"tests/test_config_safety.py" = ["F811"]
# Roadmap row 92. Same shape as test_config_safety.py above, for the same
# reason: this file imports test_api_config_editor's fixtures rather than
# rebuilding them.
"tests/test_library_overrides_api.py" = ["F811"]
# Roadmap row 55. Same shape again: the upload suite imports test_api_files.py's
# roots, config, app and client rather than rebuilding them, so the two halves
# of the row cannot drift about what a deployment looks like.
"tests/test_api_files_upload.py" = ["F811"]
