assets_root: /assets
manual_assets_root: /manualassets
backup_root: /assetsbackup
fonts_root: /app/assets/fonts
overlays_root: /app/assets/overlays
library_folders: true
workers: 5
settle_seconds: 30
magick_binary: magick
skip_tba: true
# Serves /docs, /redoc and /openapi.json. They cannot be authenticated and
# enumerate every endpoint, so they stay off outside development.
api_docs_enabled: false

plex:
  url: https://<plex-host>
  excluded_libraries: [Muskarit, Photos]
  resolve_max_attempts: 10
  liveness_interval_seconds: 60
  token_refresh_interval_seconds: 43200 # 12 hours
  token_refresh_enabled: true # disable if your token is server-scoped (would just log warnings forever)

providers:
  order: [TMDB, TVDB, Fanart]
  favourite: TMDB
  tmdb_vote_sorting: vote_average
  cache_ttl_seconds: 86400 # 24 hours; 0 disables response caching

operations:
  enabled: true
  write_to_plex: true
  imdb_refresh_hours: 6 # how often to poll the IMDb ratings dataset in the background
  imdb_refresh_enabled: true # disable to only refresh via `python -m autoposter.facts.imdb`
  imdb_miss_refresh_minutes: 60 # rate limit for the miss-triggered refresh; 0 disables it
  # Roadmap row 35 -- items whose metadata is never written to Plex. Facts are
  # still gathered and stored, so badges keep working.
  ignore_ids: []
  ignore_imdb_ids: []
  # The per-item opt-out label. Empty by default; add "skip_autoposter" (or a
  # label of your own) to use it.
  ignore_labels: []
  # Roadmap row 32 -- which provider's rating is written to Plex's user rating.
  # 'imdb' (the IMDb rating) or 'tmdb' (the TMDb audience rating). Unset writes
  # no user rating at all.
  # user_rating_source: tmdb
  # Roadmap row 33 -- which provider supplies the original-language title.
  # 'tmdb' is the only source served today. Unset writes no original title.
  # original_title_source: tmdb
  # Roadmap row 34 -- normalise values before they are written to Plex.
  # genre_mapper:
  #   "Sci-Fi & Fantasy": "Sci-Fi"
  # content_rating_mapper:
  #   "TV-MA": "18"
  # Roadmap row 84 -- which provider supplies each field. Unset keeps TMDb's.
  # genres_source: tvdb
  # studio_source: tvdb
  # originally_available_source: tvdb
  tmdb_backoff_seconds: 60 # how long TMDb is left alone after a 429 with no Retry-After; 0 disables the shared window

badges:
  enabled: true # composite badge overlays and upload them to Plex
  upload_to_plex: false # dry run by default: compose and fingerprint, upload nothing
  lock_artwork: true # lock the Plex field after upload so the agent cannot reclaim it
  apply_overlay_label: false # add the literal Plex label "Overlay", as the previous tool did
  adopt_from_plex: true # skip the upload when Plex is already serving this exact badged image

collections:
  enabled: true # reconcile the Common Sense age-bucket collections
  apply_to_plex: false # dry run by default: report the actions, change nothing
  ownership_label: autoposter # only collections carrying this label are ever modified
  libraries: # Plex library names to reconcile
    - Movies
    - TV Shows
  charts: true # IMDb Popular / Top 250 / Lowest Rated
  awards: true # Oscars winner collections
  separators: true # a blank section-divider collection per collection group
  assets_for_all_collections: false # apply a local poster (assets_root/<library>/<title>/poster.*) to collections we do not manage; ownership label never applied
  # group_order: [awards, charts] # reorder the blocks; the rest follow
  # separator_style: orig # divider colour; one of upstream's 22 sep_style names. Changing it re-posters every divider once
  posters: true # give managed collections a poster
  adopt: false # claim collections created by a tool being replaced; a Plex write, off by default
  adopt_from: # labels belonging to tools being replaced
    - Kometa
  adopt_removes_prior_label: false # strip the prior label once claimed; keeping it is reversible, this isn't
  protect_labels: # labels of other tools' collections, e.g. Maintainerr; never touched, even if also adopt_from-labelled
    - Collection managed by Maintainerr
  delete_unconfigured: false # delete collections we own once no definition builds them; the only setting here that deletes anything
  # Once delete_unconfigured is true, charts/awards/separators (and any
  # definitions: entry) become destructive to turn off: switching one off
  # orphans the collections it used to build, and the next pass's sweep may
  # delete them. awards builds exactly 5 collections (the year collections,
  # capped by imdb_award.recent_years) -- which sits AT the default
  # max_deletes below, so turning awards off deletes them rather than
  # refusing.
  max_deletes: 5 # per-pass cap on that sweep: past it it refuses entirely and reports the numbers
  # Preset collections from the catalog, switched on by key. Empty by default,
  # and an empty list builds nothing extra -- the toggles above are unaffected.
  # The keys are the ones GET /api/collections/catalog lists (the Collections
  # page's picker writes this field); an unknown one is rejected when the
  # config loads. The Oscars are the `awards:` toggle above, not a key here.
  #
  # Some presets are PACKS: one key builds one collection per value the library
  # holds (every genre, every studio, every audio language), or per value this
  # service has gathered facts for (every TMDb franchise). Switching a pack
  # ON creates that whole family on the next pass, and switching it OFF makes
  # every one of those collections an orphan at once -- which the sweep only
  # deletes if `delete_unconfigured` above is on, never more than `max_deletes`
  # of them in a pass, and never at all past that cap (it refuses the whole
  # sweep and reports the numbers instead). A pack whose enumeration would
  # exceed its own `max_collections` creates nothing and says so, rather than
  # building a prefix of the family.
  # Example:
  #   presets:
  #     - award_cannes # Cannes Golden Palm Winners + one per recent festival
  #     - content_genres # one collection per genre the library holds
  # Operator-configured collections, each built by a registered builder. An
  # unknown `builder:` is rejected when the config loads, not hours later in a
  # reconcile. Empty by default; the toggles above are unaffected. Example:
  #   definitions:
  #     - title: Hand Picked
  #       builder: plex_id # registry key; plex_id takes rating keys verbatim
  #       params:
  #         ids: ["12345", "67890"] # in the order they should appear
  #       libraries: [Movies] # omit to use collections.libraries above
  #       summary: A few favourites.
  #       sync_mode: sync # the collection is exactly this list; `append` only ever adds
  #       limit: 50 # cap on members, applied after resolution
  #       # Row 19: POST this collection's membership changes here, on top of
  #       # whatever `notifications` does. Read live -- an edit applies at the
  #       # next pass, not the next restart -- but only ever sent to when
  #       # `notifications.enabled` is true and a global `notifications.url`
  #       # is configured: the notifier is built once from it, and serves
  #       # every per-collection target. May embed a token; never logged
  #       # in full. A family definition's hook covers every collection in
  #       # it -- one POST per expanded member per pass, so a large family is
  #       # a burst worth expecting. A smart-built collection never fires
  #       # this: Plex owns smart membership, so there is no per-item delta
  #       # to report. The detail dict only reaches the wire under
  #       # `notifications.mode: autoposter-v1`; `apprise-json` drops it.
  #       changes_webhook: "" # e.g. http://n8n.n8n-prod.svc.cluster.local:5678/webhook/collection
  #       # Post-builder filtering (roadmap row 96): Kometa's
  #       # `attribute[.modifier]: value`, evaluated on the resolved items
  #       # BEFORE limit -- so a cap counts what survives the filter. Nest
  #       # `any:`/`all:` blocks for alternatives. Tier 1 is year,
  #       # resolution, audience_rating, critic_rating, content_rating,
  #       # added, release, duration and studio; any other attribute
  #       # refuses when the config loads, naming it and why.
  #       filters:
  #         year.gte: 2000
  #         content_rating: [PG-13, R]
  #       sort: custom
  #       labels: [Favourites] # extra Plex labels, beyond ownership_label
  #       label_sync: false # true makes labels + ownership_label authoritative and removes the rest
  #       item_label: [Hand Picked] # labels applied to every member; only ever added, never removed
  #       sort_title: "!010_Hand Picked" # the whole Plex sort title, not a prefix
  #       collection_mode: hide # default | hide | hideItems | showItems
  #       tmdb_summary: 10 # borrow the summary from this TMDB collection (summary: above still wins)
  #       visible_library: true # pin to the library's Recommended page (Plex Pass)
  #       visible_home: false # ...and to your Home page
  #       visible_shared: false # ...and to your friends' Home pages
  #       hub_priority: 0 # position among the library's managed recommendations, 0 = first
  #       schedule:
  #         every_n_runs: 1 # run on every Nth collections pass
  #         months: [7, 8] # ...and only during these months
  #     # One collection per distinct value the library holds (Kometa's
  #     # dynamic_collections). The definition's own title names the FAMILY and
  #     # never becomes a collection; each collection is named by title_format.
  #     - title: Decades
  #       builder: dynamic
  #       params:
  #         type: decade # year | decade | content_rating | studio | genre |
  #                      # country | resolution | audio_language |
  #                      # subtitle_language | network -- an unknown one is
  #                      # rejected when the config loads, listing these
  #         # Which values become collections. include: is a whitelist applied
  #         # last; every addon member stops getting a collection of its own.
  #         # exclude: matches the key or the displayed value; include:,
  #         # addons: and the override tables below match the KEY, which for
  #         # decade is the bare year (1980, displayed as 1980s).
  #         exclude: [1930s]
  #         addons:
  #           1980: [1970] # one collection asking for both
  #         # How they are named. <<key_name>> is the value, <<library_type>>
  #         # is `movie`/`show` and <<library_typeU>> is `Movie`/`Show`. A
  #         # <<token>> nothing here resolves is rejected at load, by name.
  #         title_format: Best <<library_type>>s of the <<key_name>>
  #         key_name_override: {2000: The Noughties} # renamed BEFORE the format
  #         title_override: {1980: Eighties Classics} # replaces the whole title
  #         remove_prefix: ["The "] # ...unless key_name_override named the key
  #         remove_suffix: [" Ltd"]
  #         other_name: Everything Else # only ever built when include: is set
  #         # What each collection asks Plex for.
  #         sort_by: [critic_rating.desc] # the search's order IS the display order
  #         limit: 50 # cap on the SEARCH, so with a sort_by it picks the top 50
  #         max_collections: 50 # refuse (with the count) rather than create more
  #       libraries: [Movies]
  #       labels: [Decades] # every collection in the family carries them
  #       sort_title: "!050_Decades" # ...and this, so the family sorts as a block
  definitions: []

cleanup:
  apply: false # dry run by default: report what would move, change nothing
  max_orphans: 500 # refuse the pass if more than this many directories look orphaned
  max_orphan_share: 0.25 # ...or more than this share of the tree; "almost everything is garbage" means something is wrong

prune:
  # Retires media_items rows Plex can no longer resolve, so they stop being
  # re-enqueued and re-parked by every full pass. Note that "cannot resolve"
  # includes items sitting in an excluded library: excluding one makes its rows
  # prunable. Files are never touched.
  apply: false # dry run by default: report which rows would go, delete nothing
  max_prunes: 500 # refuse the pass if more than this many rows look unresolvable
  max_prune_share: 0.25 # ...or more than this share of the library; "almost everything is gone" means the server changed, not the library

# Roadmap row 36 -- Plex's own housekeeping, run on scheduler.maintenance_days.
# All three off: empty_trash especially, because Plex's auto-empty-trash is off
# on this deployment and a disappearance therefore means somebody meant it.
maintenance:
  clean_bundles: false
  empty_trash: false
  optimize: false

artwork_modes:
  # Operator-triggered bulk operations: backup, restore, poster reset,
  # remove-overlays revert, logo updater/revert. Every Plex-writing mode is dry
  # run by default (the cleanup.apply posture); backup is Plex-read-only.
  plex_backup_root: /plexbackup # NEW mount for backup/restore; never backup_root, which holds relocated orphaned assets
  restore_apply: false # dry run by default: report what restore would push to Plex, change nothing
  reset_apply: false # dry run by default: report what reset would unlock and re-select
  revert_apply: false # dry run by default: report which badges revert would strip
  logo_apply: false # dry run by default: report which logos the updater would upload
  logo_revert_apply: false # dry run by default: report which logos revert would unlink
  max_changes: 500 # refuse a mode that would change more than this many items
  max_change_share: 0.25 # ...or more than this share of the candidate set; "almost everything" means the filter or mount is wrong

adopt:
  apply: false # dry run by default: produce the report, write nothing
  libraries: # Plex library names to adopt
    - Movies
    - TV Shows

scheduler:
  enabled: true # run the periodic passes (collections reconcile, drift sweep, asset cleanup, media_items prune)
  poll_seconds: 60 # how often to check whether anything is due
  collections_hours: 24 # collections reconcile cadence
  drift_days: 7 # ratings drift sweep cadence
  drift_max_age_days: 7 # re-check an item whose facts are older than this
  drift_batch_size: 500 # items enqueued per sweep; the safety valve against enqueuing everything at once
  credits_scan_days: 7 # library credits scan cadence; whole-library per run, no batch valve
  maintenance_days: 7 # Plex maintenance pass cadence
  cleanup_days: 7 # orphaned asset cleanup cadence
  prune_days: 7 # media_items prune cadence
  # cleanup_apply is not a setting here -- see cleanup.apply above, which
  # already governs whether the cleanup pass writes (dry run by default)

radarr:
  enabled: false # off until base_url is set and AUTOPOSTER_RADARR_APIKEY is exported
  base_url: http://radarr.media.svc.cluster.local
  add_existing: false # register Plex movies Radarr does not know about, in place, without downloading
  plex_path: /mnt/Media # Plex mounts the library here (capital M)
  arr_path: /mnt/media # Radarr sees the same files here (lowercase) -- case-sensitive, see arr/paths.py
  quality_profile: HD Bluray + WEB
  monitor: true
  minimum_availability: announced

sonarr:
  enabled: false # off until base_url is set and AUTOPOSTER_SONARR_APIKEY is exported
  base_url: http://sonarr.media.svc.cluster.local
  add_existing: false # register Plex shows Sonarr does not know about, in place, without downloading
  plex_path: /mnt/Media
  arr_path: /mnt/media
  quality_profile: WEB-1080p
  monitor: true
  season_folder: true
  series_type: standard

tracearr:
  enabled: false # off until base_url is set and AUTOPOSTER_TRACEARR_APIKEY is exported
  base_url: http://tracearr.media.svc.cluster.local
  # api_key is deliberately not a key here -- it is AUTOPOSTER_TRACEARR_APIKEY,
  # the same posture as radarr/sonarr. Switching this on makes the
  # `chart_tracearr_movies` / `chart_tracearr_shows` presets buildable; it does
  # not switch them on, which is `collections.presets`.

arr_sync:
  enabled: true # the safety net (enqueue unrecorded Plex items) runs even when both services above are disabled
  hours: 24 # Radarr/Sonarr registration cadence
  batch_size: 500 # safety-net items enqueued per pass; same safety valve as scheduler.drift_batch_size

notifications:
  enabled: false # POST run-completion webhooks to `url`; off until pointed somewhere
  url: "" # e.g. http://n8n.n8n-prod.svc.cluster.local:5678/webhook/autoposter -- may embed a token, never logged in full
  # Payload shape (see src/autoposter/notify/payload.py for both contracts):
  #   apprise-json (default): the body Apprise's json:// scheme POSTs --
  #     {"version": "1.0", "title": ..., "message": ..., "attachments": [],
  #      "type": "success" | "failure"} -- what an Apprise-trained consumer
  #     or a `body.type === "success"` gate expects.
  #   autoposter-v1: this service's own versioned shape --
  #     {"schema": "autoposter/v1", "event": ..., "at": <ISO 8601 UTC>,
  #      "summary": ..., "detail": {...}} -- carries the full detail dict.
  mode: apprise-json
  timeout_seconds: 10 # per-attempt HTTP timeout
  retry_count: 3 # attempts before giving up; notification failure never fails the run it reports on

artwork:
  use_logo: true
  logo_language_order: [en, fi]
  logo_text_fallback: false
  # Roadmap row 38 -- per-library language order, keyed by library then art
  # kind (poster/season_poster/background/title_card). An art kind not named
  # keeps its own language_order below.
  # Example:
  #   library_language_overrides:
  #     Anime:
  #       poster: [ja, en]
  library_language_overrides: {}
  # Roadmap row 47 -- make no online provider request for any artifact. A
  # manually supplied local asset (including a picked logo) is unaffected and
  # still used. Individual art kinds can override this either way.
  disable_online_asset_fetch: false
  # Roadmap row 48 -- apply a show's SeasonTemplate/EpisodeTemplate manual
  # assets to every season poster and title card beneath it that has none of
  # its own.
  season_episode_templates: false
  # Roadmap row 44 -- draw an item's original-language title instead of the
  # localized one, where Plex carries one.
  use_original_title: false
  # Roadmap row 45 -- prefer Fanart.tv clearart over clearlogo when
  # compositing a logo onto a poster.
  use_clearart: false
  # Roadmap row 46 -- flatten every composited clearlogo to this one colour.
  # Unset leaves each logo its own colours.
  logo_flat_color: null
  output_quality: 92%

  poster:
    enabled: true
    language_order: [xx, en, fi]
    overlay_file: overlay.png
    add_overlay: true
    add_border: false
    border_color: white
    border_width: 30
    skip_local_text_add: false
    disable_online_asset_fetch: null
    skip_add_text_when_with_text: false
    text:
      font: Comfortaa-Medium.ttf
      all_caps: true
      font_color: white
      min_point_size: 83
      max_point_size: 250
      max_width: 1200
      max_height: 485
      text_offset: "+300"
      gravity: south
      line_spacing: 0
      add_text: true
      add_stroke: false
      stroke_color: black
      stroke_width: 6
      newline_on_symbols: []
      newline_words: {}

  season_poster:
    enabled: true
    language_order: [xx, en, fi]
    overlay_file: bottom-up-fade.png
    add_overlay: true
    add_border: false
    skip_local_text_add: false
    disable_online_asset_fetch: null
    skip_add_text_when_with_text: false
    text:
      font: Comfortaa-Medium.ttf
      all_caps: true
      font_color: white
      min_point_size: 100
      max_point_size: 250
      max_width: 1200
      max_height: 485
      text_offset: "+300"
      gravity: south
      add_text: true
      add_stroke: false
      newline_on_symbols: []
      newline_words: {}

  background:
    enabled: true
    language_order: [xx, en, fi]
    overlay_file: bottom-up-fade-background.png
    add_overlay: true
    add_border: false
    skip_local_text_add: false
    disable_online_asset_fetch: null
    skip_add_text_when_with_text: false
    text:
      font: Comfortaa-Medium.ttf
      all_caps: true
      font_color: white
      min_point_size: 95
      max_point_size: 250
      max_width: 3000
      max_height: 500
      text_offset: "+200"
      gravity: south
      add_text: false
      add_stroke: false
      newline_on_symbols: []
      newline_words: {}

  title_card:
    enabled: true
    language_order: [xx, en, fi]
    overlay_file: bottom-up-fade-background.png
    add_overlay: true
    add_border: false
    season_label: Season
    episode_label: Episode
    skip_words: [TBA]
    skip_local_text_add: false
    disable_online_asset_fetch: null
    skip_add_text_when_with_text: false
    skip_cjk_titles: false
    season_name_overrides: {}
    text:
      font: Comfortaa-Medium.ttf
      all_caps: true
      font_color: white
      min_point_size: 48
      max_point_size: 140
      max_width: 2500
      max_height: 300
      # Deliberate hide idiom: a negative south-gravity offset pushes this
      # text block fully off-canvas so title cards show only the
      # season/episode line below. The captured Posterizarr log used -150,
      # which left tall glyphs peeking into frame at all three title
      # lengths tested; -400 clears the 300px caption box entirely.
      text_offset: "-400"
      gravity: south
      add_text: true
      add_stroke: false
      newline_on_symbols: []
      newline_words: {}
    episode_text:
      font: Comfortaa-Medium.ttf
      all_caps: true
      font_color: white
      min_point_size: 48
      max_point_size: 80
      max_width: 2500
      max_height: 150
      text_offset: "+100"
      gravity: south
      add_text: true
      add_stroke: false
