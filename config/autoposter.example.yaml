assets_root: /assets
manual_assets_root: /manualassets
backup_root: /assetsbackup
fonts_root: /app/assets/fonts
overlays_root: /app/assets/overlays
library_folders: true
workers: 5
settle_seconds: 30
magick_binary: magick
skip_tba: true
# Serves /docs, /redoc and /openapi.json. They cannot be authenticated and
# enumerate every endpoint, so they stay off outside development.
api_docs_enabled: false

# This deployment's own externally reachable base URL. The setup wizard and the
# Settings page point Radarr's and Sonarr's Webhook connections at
# <public_url>/webhook/<service>. Empty registers nothing.
public_url: ""

plex:
  url: https://<plex-host>
  excluded_libraries: [Muskarit, Photos]
  resolve_max_attempts: 10
  liveness_interval_seconds: 60
  token_refresh_interval_seconds: 43200 # 12 hours
  token_refresh_enabled: true # disable if your token is server-scoped (would just log warnings forever)

providers:
  order: [TMDB, TVDB, Fanart]
  favourite: TMDB
  tmdb_vote_sorting: vote_average
  cache_ttl_seconds: 86400 # 24 hours; 0 disables response caching

operations:
  enabled: true
  write_to_plex: true
  imdb_refresh_hours: 6 # how often to poll the IMDb ratings dataset in the background
  imdb_refresh_enabled: true # disable to only refresh via `python -m autoposter.facts.imdb`
  imdb_miss_refresh_minutes: 60 # rate limit for the miss-triggered refresh; 0 disables it
  # Roadmap row 35 -- items whose metadata is never written to Plex. Facts are
  # still gathered and stored, so badges keep working.
  ignore_ids: []
  ignore_imdb_ids: []
  # The per-item opt-out label. Empty by default; add "skip_autoposter" (or a
  # label of your own) to use it.
  ignore_labels: []
  # Roadmap row 32 -- which provider's rating is written to Plex's user rating.
  # 'imdb' (the IMDb rating) or 'tmdb' (the TMDb audience rating). Unset writes
  # no user rating at all.
  # user_rating_source: tmdb
  # Roadmap row 33 -- which provider supplies the original-language title.
  # 'tmdb' is the only source served today. Unset writes no original title.
  # original_title_source: tmdb
  # Roadmap row 34 -- normalise values before they are written to Plex.
  # genre_mapper:
  #   "Sci-Fi & Fantasy": "Sci-Fi"
  # content_rating_mapper:
  #   "TV-MA": "18"
  # Roadmap row 84 -- which provider supplies each field. Unset keeps TMDb's.
  # genres_source: tvdb
  # studio_source: tvdb
  # originally_available_source: tvdb
  # Roadmap row 87 -- a verb applied to a field INSTEAD of writing a
  # provider's value into it. Each verb has its own apply flag, off by default.
  # field_verbs:
  #   studio: unlock
  # lock_apply: false
  # unlock_apply: false
  # remove_apply: false
  # Roadmap row 85 -- IMDb's own parental-guide categories, written as Plex
  # labels (e.g. "Violence & Gore: Severe"). `enabled` gates the fetch,
  # `apply` gates the write -- the same split row 87's verbs use.
  # parental_labels_enabled: false
  # parental_labels_apply: false
  # parental_labels_include_none: false
  # Roadmap row 99 -- per-item metadata overrides, declared one item at a time
  # from the item page. Off leaves any stored overrides in place and ignored
  # (the panel goes read-only), so turning this back on restores them.
  # There is no separate apply flag: the panel's own confirm is the consent.
  # item_overrides_enabled: false
  # Roadmap row 86 -- export current Plex metadata to a YAML backup.
  # metadata_backup_enabled: false
  # metadata_backup_root: /metadatabackup
  tmdb_backoff_seconds: 60 # how long TMDb is left alone after a 429 with no Retry-After; 0 disables the shared window

badges:
  enabled: true # composite badge overlays and upload them to Plex
  upload_to_plex: false # dry run by default: compose and fingerprint, upload nothing
  lock_artwork: true # lock the Plex field after upload so the agent cannot reclaim it
  apply_overlay_label: false # add the literal Plex label "Overlay", as the previous tool did
  adopt_from_plex: true # skip the upload when Plex is already serving this exact badged image
  # Roadmap row 100. Opt-in bundles of this service's own transcription of
  # Kometa's overlay families -- naming one draws its whole set, before
  # definitions: below (so those can suppress a family member). Empty means
  # no change at all. Available: aspect, content_rating_au,
  # content_rating_de, content_rating_nz, content_rating_uk,
  # content_rating_us_movie, content_rating_us_show, direct_play,
  # language_count, status, versions. An unknown or repeated name is
  # refused at load, naming what is available.
  #
  # aspect draws the film's ratio (1.33 ... 2.77) as text, and only for an
  # item Plex has already analysed -- an unanalysed file carries no
  # aspectRatio and draws nothing rather than a wrong band. language_count
  # draws Dual for exactly two audio TRACKS and Multi for two or more --
  # at exactly two, Dual wins by weight, so Multi shows from three.
  # Tracks, not distinct languages: that is how Kometa counts, so a film
  # with an English track plus an English commentary track is Dual. It also
  # shares its slot with direct_play, which is upstream's own arrangement --
  # enabling both draws two badges in one place. Both verdicts are
  # recomputed from live Plex on every visit, so a re-analysis or a new
  # audio track shows up on the NEXT pass over that item -- there is no
  # watcher; the revisit cadence is the *arr intake and the drift sweep.
  #
  # status draws AIRING / RETURNING / CANCELED / ENDED for SHOWS, from
  # TMDb's own airing status and last air date. Two caveats worth knowing
  # before enabling it. First, the data is gathered rather than read live:
  # both values are new item_facts columns, so every show is NULL until its
  # next facts refresh and draws nothing in the meantime -- the drift sweep
  # converges over weeks, and the facts-backfill trigger in the Action
  # Center fills the whole library in a handful of presses. Second, AIRING
  # means "TMDb says an episode aired in the last 14 days", which is not
  # quite Kometa's question ("this library holds an episode that aired in
  # the last 14 days") -- they differ when the library lags broadcast. A
  # show can match AIRING and ENDED at once, in which case AIRING wins by
  # weight, which is upstream's own arrangement.
  #
  # Enabling a family re-badges every item it already matches, once: the
  # first condition: this config ever carries -- from a family or from
  # definitions: below -- moves every already-badged item's fingerprint a
  # single time, then the config is stable again.
  #
  # families:
  #   - direct_play
  families: []
  # Roadmap row 97. Operator-defined overlays, drawn on top of the nine
  # built-in badges. Empty means no change at all.
  #
  # Each entry takes the attributes Kometa's own `overlay:` block does:
  # name, group/weight, suppress_overlays, horizontal_/vertical_offset and
  # _align, scale_width/scale_height, back_color/back_line_color/
  # back_line_width/back_radius/back_padding/back_align/back_width/
  # back_height, one image source (file, builtin or url), and for a
  # `text(...)` name the font, font_size, font_color, stroke_width,
  # stroke_color, addon_offset and addon_position -- plus `condition:`.
  #
  # `file:` is a path under overlays_root. `builtin:` is a path in this
  # service's bundled overlay-stamp tree (no .png needed). `url:` is
  # downloaded once and cached under overlays_root/.cache/ by URL.
  #
  # `condition:` restricts a definition to matching items, in the same
  # attribute/operator/value grammar collections' own `filters:` block uses
  # -- but a narrower vocabulary: only content_rating and resolution, what
  # this service can read off an already-badged item. A definition with no
  # condition draws on every badged item. An unknown attribute, an operator
  # the attribute does not carry, or a collections-only attribute this
  # narrowing does not reach is refused at load, naming what is allowed.
  #
  # definitions:
  #   - name: "text(4K)"
  #     horizontal_align: right
  #     horizontal_offset: 15
  #     vertical_align: top
  #     vertical_offset: 15
  #     back_width: 200
  #     back_height: 105
  #     back_color: "#00000099"
  #     back_radius: 30
  #     font_size: 55
  #     condition:
  #       resolution.regex: "(?i)2160|4k"
  definitions: []
  # Largest image a definition's `url:` source may download, in bytes.
  definition_image_max_bytes: 5242880

collections:
  enabled: true # reconcile the Common Sense age-bucket collections
  apply_to_plex: false # dry run by default: report the actions, change nothing
  mdblist_sync_apply: false # row 31: actually push definitions' sync_to_mdb_list members; off only reports what would be pushed
  arr_tag_apply: false # row 89: actually write definitions' item_radarr_tag/item_sonarr_tag tags to Radarr/Sonarr; off only reports what would be written
  ownership_label: autoposter # only collections carrying this label are ever modified
  libraries: # Plex library names to reconcile
    - Movies
    - TV Shows
  charts: true # IMDb Popular / Top 250 / Lowest Rated -- one switch for all three; for a subset, turn this off and write the ones you want as definitions with builder: imdb_chart
  awards: true # Oscars winner collections
  separators: true # a blank section-divider collection per collection group
  assets_for_all_collections: false # apply a local poster (assets_root/<library>/<title>/poster.*) to collections we do not manage; ownership label never applied
  # group_order: [awards, charts] # reorder the blocks; the rest follow
  # separator_style: orig # divider colour; one of upstream's 22 sep_style names. Changing it re-posters every divider once
  posters: true # give managed collections a poster
  # Row 105. Draw a styled collection title, plus the fixed second line below,
  # onto every managed collection poster this service FETCHES, before it is
  # uploaded. Off by default, and off is byte-identical to not having it.
  #
  # Turning it on moves poster_sha256 for every affected collection ONCE, so
  # each of their posters is re-uploaded once and then settles -- the compare
  # is over content, not over a config hash. It happens on the NEXT pass, not
  # eventually: these settings are also part of the definition hash a pass
  # short-circuits on, so that pass re-writes each affected collection's own
  # summary and sort title too, once, with the values already there. Settings'
  # preview counts them before you commit. Nothing in this section can
  # re-render a single library item: render_version excludes the whole
  # collections section, and with this off nothing here reaches any hash at
  # all -- retune every box below and no collection is revisited.
  #
  # NEVER drawn on: a poster you placed yourself under assets_root (which is
  # also where the manual poster endpoint writes), a divider's art (it already
  # carries the group's name), and any collection this service does not manage.
  #
  # STYLED AFTER Posterizarr's CollectionPosterOverlayPart and
  # CollectionTitlePosterPart, NOT byte-matched to them: no captured
  # Posterizarr output exists anywhere to render against, so the values below
  # are transcribed from the INPUT side and nothing here is a parity proof.
  # Three of them are ours rather than upstream's, and are marked. AddBorder
  # and AddOverlay from that part are not implemented and have no key here.
  #
  # Sizes and offsets are pixels against a 2000-pixel-wide poster and are
  # scaled to whatever poster is actually fetched. text_offset must carry an
  # explicit sign; gravity is north, center or south.
  #
  # font: any file under fonts_root, or one of the bundled faces
  # (Inter-Medium.ttf, Inter-Bold.ttf). Posterizarr's own Colus-Regular.ttf is
  # not shipped -- drop your copy into fonts_root and name it here to use it.
  # poster_title:
  #   enabled: false
  #   collection_line_text: COLLECTION # the fixed second line; empty draws none
  #   title: # CollectionPosterOverlayPart, transcribed (except font)
  #     font: Inter-Medium.ttf # ours: Colus-Regular.ttf is not vendored
  #     min_point_size: 100
  #     max_point_size: 250
  #     max_width: 1900
  #     max_height: 500
  #     text_offset: "+300"
  #     gravity: south
  #   collection_line: # colour/stroke/caps from CollectionTitlePosterPart
  #     font: Inter-Medium.ttf # ours, as above
  #     min_point_size: 40 # ours: upstream's 83-250 is for a title, not a word
  #     max_point_size: 90 # ours
  #     max_width: 1200
  #     max_height: 150 # ours
  #     text_offset: "+120" # ours: upstream gives both parts +300 because they
  #                         # are two poster TYPES there, not two blocks on one
  #                         # image -- copying it would draw this through the title
  #     gravity: south
  adopt: false # claim collections created by a tool being replaced; a Plex write, off by default
  adopt_from: # labels belonging to tools being replaced
    - Kometa
  adopt_removes_prior_label: false # strip the prior label once claimed; keeping it is reversible, this isn't
  protect_labels: # labels of other tools' collections, e.g. Maintainerr; never touched, even if also adopt_from-labelled
    - Collection managed by Maintainerr
  delete_unconfigured: false # delete collections we own once no definition builds them; the only setting here that deletes anything
  # Once delete_unconfigured is true, charts/awards/separators (and any
  # definitions: entry) become destructive to turn off: switching one off
  # orphans the collections it used to build, and the next pass's sweep may
  # delete them. awards builds exactly 5 collections (the year collections,
  # capped by imdb_award.recent_years) -- which sits AT the default
  # max_deletes below, so turning awards off deletes them rather than
  # refusing.
  max_deletes: 5 # per-pass cap on that sweep: past it it refuses entirely and reports the numbers
  # Preset collections from the catalog, switched on by key. Empty by default,
  # and an empty list builds nothing extra -- the toggles above are unaffected.
  # The keys are the ones GET /api/collections/catalog lists (the Collections
  # page's picker writes this field); an unknown one is rejected when the
  # config loads. The Oscars are the `awards:` toggle above, not a key here.
  #
  # Some presets are PACKS: one key builds one collection per value the library
  # holds (every genre, every studio, every audio language), or per value this
  # service has gathered facts for (every TMDb franchise). Switching a pack
  # ON creates that whole family on the next pass, and switching it OFF makes
  # every one of those collections an orphan at once -- which the sweep only
  # deletes if `delete_unconfigured` above is on, never more than `max_deletes`
  # of them in a pass, and never at all past that cap (it refuses the whole
  # sweep and reports the numbers instead). A pack whose enumeration would
  # exceed its own `max_collections` creates nothing and says so, rather than
  # building a prefix of the family.
  # Example:
  #   presets:
  #     - award_cannes # Cannes Golden Palm Winners + one per recent festival
  #     - content_genres # one collection per genre the library holds
  # Operator-configured collections, each built by a registered builder. An
  # unknown `builder:` is rejected when the config loads, not hours later in a
  # reconcile. Empty by default; the toggles above are unaffected. Example:
  #   definitions:
  #     - title: Hand Picked
  #       builder: plex_id # registry key; plex_id takes rating keys verbatim
  #       params:
  #         ids: ["12345", "67890"] # in the order they should appear
  #       libraries: [Movies] # omit to use collections.libraries above
  #       summary: A few favourites.
  #       sync_mode: sync # the collection is exactly this list; `append` only ever adds
  #       limit: 50 # cap on members, applied after resolution
  #       # Row 31: after this definition's own membership is resolved, push its
  #       # imdb/tmdb/tvdb ids to this MDBList list (additions only). Requires
  #       # collections.mdblist_sync_apply above; off reports what would push.
  #       sync_to_mdb_list: "myuser/my-list"
  #       # row 89: keep only the members the configured instance already
  #       # holds, and tag those members there. Read-only otherwise -- this
  #       # never asks Radarr or Sonarr to acquire anything. Item-level only
  #       # (the default here) -- an Arr instance knows nothing below
  #       # movie/show granularity, which is also why this can't combine with
  #       # `builder_level:` below (see the `Season Premieres` example).
  #       radarr_restrict: true
  #       item_radarr_tag: ["autoposter"]
  #       # Row 19: POST this collection's membership changes here, on top of
  #       # whatever `notifications` does. Read live -- an edit applies at the
  #       # next pass, not the next restart -- but only ever sent to when
  #       # `notifications.enabled` is true and a global `notifications.url`
  #       # is configured: the notifier is built once from it, and serves
  #       # every per-collection target. May embed a token; never logged
  #       # in full. A family definition's hook covers every collection in
  #       # it -- one POST per expanded member per pass, so a large family is
  #       # a burst worth expecting. A smart-built collection never fires
  #       # this: Plex owns smart membership, so there is no per-item delta
  #       # to report. The detail dict only reaches the wire under
  #       # `notifications.mode: autoposter-v1`; `apprise-json` drops it.
  #       changes_webhook: "" # e.g. http://n8n.n8n-prod.svc.cluster.local:5678/webhook/collection
  #       # Post-builder filtering (roadmap row 96): Kometa's
  #       # `attribute[.modifier]: value`, evaluated on the resolved items
  #       # BEFORE limit -- so a cap counts what survives the filter. Nest
  #       # `any:`/`all:` blocks for alternatives. Tier 1 is year,
  #       # resolution, audience_rating, critic_rating, content_rating,
  #       # added, release, duration and studio; any other attribute
  #       # refuses when the config loads, naming it and why.
  #       # Row 158: a TAG value (genre, label, collection, content_rating,
  #       # resolution, audio_language, subtitle_language) is checked against
  #       # the library's own list of that tag when the pass runs. A value
  #       # this library does not use is reported and DROPPED, and the rest of
  #       # the filter still applies -- so a typo says so instead of quietly
  #       # building an empty collection, and a regional rating list stays
  #       # usable on a library that only uses part of it. A filter whose
  #       # values ALL drop matches nothing, and says that too.
  #       # Row 156: three attributes read this service's own gathered facts
  #       # rather than Plex -- common_sense_rating (the Common Sense age
  #       # band, written as a bare number: 8, 13, 16), imdb_rating and
  #       # tmdb_rating (0-10). They carry names of their own because
  #       # Kometa's content_rating/critic_rating/audience_rating read
  #       # DIFFERENT values out of Plex, and one spelling for two answers is
  #       # the bug this avoids. An item the facts pass has not visited yet
  #       # is EXCLUDED under every operator, `.not` included, so a
  #       # collection on one of these starts small and grows as the sweep
  #       # catches up; and their values are NOT vocabulary-checked, so a
  #       # misspelling builds an empty collection silently. See the
  #       # "Attributes this service holds itself" section of deploy/README.md.
  #       filters:
  #         year.gte: 2000
  #         content_rating: [PG-13, R]
  #       sort: custom
  #       labels: [Favourites] # extra Plex labels, beyond ownership_label
  #       label_sync: false # true makes labels + ownership_label authoritative and removes the rest
  #       item_label: [Hand Picked] # labels applied to every member; only ever added, never removed
  #       sort_title: "!010_Hand Picked" # the whole Plex sort title, not a prefix
  #       collection_mode: hide # default | hide | hideItems | showItems
  #       tmdb_summary: 10 # borrow the summary from this TMDB collection (summary: above still wins)
  #       visible_library: true # pin to the library's Recommended page (Plex Pass)
  #       visible_home: false # ...and to your Home page
  #       visible_shared: false # ...and to your friends' Home pages
  #       hub_priority: 0 # position among the library's managed recommendations, 0 = first
  #       schedule:
  #         every_n_runs: 1 # run on every Nth collections pass
  #         months: [7, 8] # ...and only during these months
  #     # One collection per distinct value the library holds (Kometa's
  #     # dynamic_collections). The definition's own title names the FAMILY and
  #     # never becomes a collection; each collection is named by title_format.
  #     - title: Decades
  #       builder: dynamic
  #       params:
  #         type: decade # year | decade | content_rating | studio | genre |
  #                      # country | resolution | audio_language |
  #                      # subtitle_language | network -- an unknown one is
  #                      # rejected when the config loads, listing these
  #         # Which values become collections. include: is a whitelist applied
  #         # last; every addon member stops getting a collection of its own.
  #         # exclude: matches the key or the displayed value; include:,
  #         # addons: and the override tables below match the KEY, which for
  #         # decade is the bare year (1980, displayed as 1980s).
  #         exclude: [1930s]
  #         addons:
  #           1980: [1970] # one collection asking for both
  #         # How they are named. <<key_name>> is the value, <<library_type>>
  #         # is `movie`/`show` and <<library_typeU>> is `Movie`/`Show`. A
  #         # <<token>> nothing here resolves is rejected at load, by name.
  #         title_format: Best <<library_type>>s of the <<key_name>>
  #         key_name_override: {2000: The Noughties} # renamed BEFORE the format
  #         title_override: {1980: Eighties Classics} # replaces the whole title
  #         remove_prefix: ["The "] # ...unless key_name_override named the key
  #         remove_suffix: [" Ltd"]
  #         other_name: Everything Else # only ever built when include: is set
  #         # What each collection asks Plex for.
  #         sort_by: [critic_rating.desc] # the search's order IS the display order
  #         limit: 50 # cap on the SEARCH, so with a sort_by it picks the top 50
  #         max_collections: 50 # refuse (with the count) rather than create more
  #       libraries: [Movies]
  #       labels: [Decades] # every collection in the family carries them
  #       sort_title: "!050_Decades" # ...and this, so the family sorts as a block
  #     # row 88: whether a definition's members are the library's own items
  #     # (the default, as above), their seasons, or their episodes. Show
  #     # libraries only, and list builders only -- a smart collection's level
  #     # is rows 173/179. A non-item level cannot also set sync_to_mdb_list or
  #     # the row 89 Arr fields (see `Hand Picked` above) -- an Arr instance,
  #     # and an MDBList list, know nothing below movie/show granularity.
  #     - title: Season Premieres
  #       builder: plex_id
  #       params:
  #         ids: ["54321"]
  #       libraries: [TV Shows]
  #       builder_level: episode
  #     # A Plex-native smart collection from a query PLEX built (row 184).
  #     # Build the search in Plex Web, copy the whole address bar, paste it
  #     # here -- the query in it is extracted and stored as the collection's
  #     # filter, and Plex evaluates the membership live from then on. It is a
  #     # spelling of `smart_filter`, not a second grammar: the same paste and
  #     # the equivalent `smart_filter` definition store an identical filter.
  #     # A pasted URL carrying an X-Plex-Token is REFUSED at config load --
  #     # remove the X-Plex-Token query parameter; the server's own token is
  #     # used, so it is never needed here.
  #     # Copy the `https://app.plex.tv/desktop/#!/server/...` form: a
  #     # `.../web/index.html#!/...` address keeps its query in the URL
  #     # fragment, where nothing can read it.
  #     # `sort`, `limit`, `sync_mode`, `item_label` and `filters` are refused
  #     # on a smart definition, by name, when the config loads -- Plex owns
  #     # this membership, so there is nothing here to cap, sync or label.
  #     - title: Pasted Horror
  #       builder: smart_url
  #       params:
  #         url: "https://app.plex.tv/desktop/#!/server/abc123/com.plexapp.plugins.library?key=%2Flibrary%2Fsections%2F1%2Fall%3Ftype%3D1%26sort%3Drandom%26genre%3D1138"
  #     # A show-library search whose predicates read EPISODE or SEASON data
  #     # (roadmap row 173, search tail E-1). Show libraries only; a movie
  #     # library refuses each name and says so. These select SHOWS -- a show
  #     # having an episode that matches -- exactly as Kometa renders them
  #     # under a show collection (`type=2&...&episode.title<=Pilot`).
  #     # Collecting the matching episodes THEMSELVES is `builder_level:`
  #     # (`season` or `episode`) on the definition: the search becomes a
  #     # type=3/type=4 query and the members are seasons or episodes. Show
  #     # libraries only; pick a sort from that level, or omit `sort_by`.
  #     # The twenty: season_collection, season_label, episode_collection,
  #     # episode_label, episode_title, episode_actor, episode_added,
  #     # episode_air_date, episode_last_played, episode_plays (ranges only),
  #     # episode_user_rating, episode_critic_rating, episode_audience_rating,
  #     # episode_year, episode_unplayed, episode_duplicate, episode_progress,
  #     # episode_unmatched, show_unmatched, unplayed_episodes. Each takes the
  #     # modifiers of its type (tag/str/int/float/date/bool), as documented on
  #     # the item-level row of the same shape.
  #     # `folder_location` (roadmap row 176) is the library FOLDER an item is
  #     # in, and the one attribute whose Plex field is read from your server at
  #     # run time rather than written down here -- Plex has no fixed name for
  #     # the filter. Movie and show libraries both; on a show library it
  #     # matches by EPISODE folder, which is the only level Plex exposes one
  #     # at. Values resolve against the library's own folder list, so
  #     # `.regex` works over them too. Refused on `smart_filter`: a stored
  #     # smart query must not depend on a field the server can rename.
  #     - title: On the NAS
  #       builder: plex_search
  #       params:
  #         all:
  #           folder_location: /mnt/media/Movies
  #       libraries: [Movies]
  #     - title: Recently Aired
  #       builder: plex_search
  #       params:
  #         all:
  #           episode_air_date: 14 # an episode aired in the last 14 days
  #           unplayed_episodes: true # ...and the show has episodes left to play
  #         sort_by: episode_added.desc
  #         limit: 25
  #       libraries: [TV Shows]
  definitions: []

playlists:
  enabled: true # build and manage playlists at all
  apply_to_plex: false # dry run by default: report the actions, change nothing
  # libraries: [Movies] # narrow which libraries members resolve from, searched in this order, first match winning; omitted means collections.libraries
  delete_unconfigured: false # delete playlists we own once no definition builds them; the only setting here that deletes anything
  max_deletes: 5 # past this many orphans one sweep refuses entirely and reports the numbers
  sync_to_users_apply: false # copy playlists into other people's accounts; off reports what each would receive
  sync_all_users: false # allow `sync_to_users: all` on a definition below
  exclude_users: [] # users a playlist never syncs to, by the display title Plex shows -- whether `all` resolved to them or a definition named them explicitly
  max_users: 25 # past this many resolved users the whole fan-out refuses and reports the numbers
  max_user_writes: 50 # past this many writes across every user copy, likewise
  # A playlist is ours if and only if a managed_playlists row's rating key
  # names a playlist currently on the server -- there is no ownership label,
  # because a Plex playlist cannot carry one. A playlist this service did not
  # create is never modified and never deleted, whatever its title.
  #
  # A user's copy is a SEPARATE playlist in their account with its own rating
  # key, and it is ours only while a managed_playlist_users row names it -- so
  # a playlist somebody made themselves under one of these titles is never
  # touched. Copies are diffed, never deleted and recreated. Nothing is written
  # to anybody's account until sync_to_users_apply is switched on, and a
  # PIN-protected user is always skipped by name: this service never holds a
  # Plex PIN. Per-user sync needs AUTOPOSTER_PLEX_ACCOUNT_TOKEN, and that token
  # must be this server's OWNER's -- the pass verifies it before its first
  # write. A user's copy is created in the definition's order and is not
  # reordered afterwards.
  #
  #   - title: Marvel Cinematic Universe
  #     builder: imdb_list # any registered list builder; smart and family builders are refused by name
  #     params:
  #       list: ls539646485 # `list`, the name the IMDb URL uses -- not `list_id`
  #     libraries: [Movies, TV Shows] # searched in this order; an id both own resolves to the first
  #     summary: The films, in release order.
  #     sync_mode: sync # or `append`: only ever adds, never removes, never reorders
  #     builder_level: item # or `season`/`episode` -- Show libraries only
  #     sync_to_users: [alice, bob] # also copy it into these users' accounts, by their Plex display title; or `all`
  #     limit: 50 # cap applied after resolution
  definitions: []
  presets: [] # preset timeline playlists to build, by key; an empty list builds none
  # The nine keys, all built from list builders that already ship (no Trakt):
  #   arrowverse_timeline, mcu_timeline, dc_animated_timeline, pokemon_timeline,
  #   star_trek_timeline, star_wars_timeline, clone_wars_timeline,
  #   x_men_timeline, dragon_ball_timeline
  # A preset is data: switch one on by listing its key, off by removing it, and
  # override one by writing a definition above with the same title -- the
  # definition wins and the displaced preset is reported, never silently
  # replaced.
  # pokemon_timeline and dragon_ball_timeline are MDBList lists and need an
  # MDBList API key. Without one they build nothing, and each pass says so by
  # key rather than leaving them quietly empty.

cleanup:
  apply: false # dry run by default: report what would move, change nothing
  max_orphans: 500 # refuse the pass if more than this many directories look orphaned
  max_orphan_share: 0.25 # ...or more than this share of the tree; "almost everything is garbage" means something is wrong

prune:
  # Retires media_items rows Plex can no longer resolve, so they stop being
  # re-enqueued and re-parked by every full pass. Note that "cannot resolve"
  # includes items sitting in an excluded library: excluding one makes its rows
  # prunable. Files are never touched.
  apply: false # dry run by default: report which rows would go, delete nothing
  max_prunes: 500 # refuse the pass if more than this many rows look unresolvable
  max_prune_share: 0.25 # ...or more than this share of the library; "almost everything is gone" means the server changed, not the library

merge:
  # Reconciles the pairs of media_items rows a re-matched item left behind
  # before the pipeline learned to re-key: renders, facts, credits,
  # dismissals and child rows move onto the surviving twin, then the stale
  # row is deleted. Files are never touched -- both rows record the same
  # asset paths. The dry run needs no Plex at all; the applied pass verifies
  # each survivor against Plex before deleting its twin.
  apply: false # dry run by default: report which pairs would merge, delete nothing
  max_merges: 500 # refuse the pass if more than this many twin pairs are found
  max_merge_share: 0.25 # ...or if the rows in those pairs (two per pair) are more than this share of the library; that means the identity predicate is matching something it should not

# Roadmap row 36 -- Plex's own housekeeping, run on scheduler.maintenance_days.
# All three off: empty_trash especially, because Plex's auto-empty-trash is off
# on this deployment and a disappearance therefore means somebody meant it.
maintenance:
  clean_bundles: false
  empty_trash: false
  optimize: false

# Roadmap row 92. Per-library overrides: a Plex library name, then only the
# settings that library does differently. Anything absent is the global value
# above -- so this block stays exactly as long as the differences are, and an
# empty block is the same as no block.
#
# Every key must be one of `collections.libraries` above; a name that is not
# is refused at load, because this file holds library NAMES and nothing that
# says whether a name is real, so a typo cannot be told apart from a rename.
#
# Three sections are overridable, and each excludes what cannot be scoped:
#   operations  -- everything except the four IMDb/TMDb loop settings (one
#                  process-wide object each) and the two metadata_backup
#                  paths (one file tree for the whole server)
#   badges      -- everything except `definitions` (a list replaces wholesale,
#                  so a per-library list would silently drop every global
#                  definition -- a definition targets its own libraries
#                  instead) and `definition_image_max_bytes` (a safety bound)
#   maintenance -- `empty_trash` only: Plex's cleanBundles and optimize are
#                  server-wide calls with no per-section form
# A setting named here that is not overridable is refused with that reason,
# never dropped in silence.
#
# `artwork` is deliberately NOT here. `render_version` hashes that section
# wholesale into the one version every stored fingerprint carries, so a
# per-library artwork setting would either strand every library's renders or
# silently never invalidate anything. It waits for roadmap row 111's
# `render_version_for` to grow a library argument.
#
# Merge rule: leaf by leaf. A stated leaf wins for that library; an absent one
# inherits. Lists replace wholesale (`ignore_labels: []` means none, not "the
# global ones"); mappings like `genre_mapper` merge key by key, exactly as the
# stored overrides document already merges them.
libraries: {}
#  TV Shows:
#    operations:
#      write_to_plex: false
#      ignore_labels:
#        - skip_autoposter
#    badges:
#      upload_to_plex: false
#    maintenance:
#      empty_trash: true

artwork_modes:
  # Operator-triggered bulk operations: backup, restore, poster reset,
  # remove-overlays revert, logo updater/revert. Every Plex-writing mode is dry
  # run by default (the cleanup.apply posture); backup is Plex-read-only.
  plex_backup_root: /plexbackup # NEW mount for backup/restore; never backup_root, which holds relocated orphaned assets
  restore_apply: false # dry run by default: report what restore would push to Plex, change nothing
  reset_apply: false # dry run by default: report what reset would unlock and re-select
  revert_apply: false # dry run by default: report which badges revert would strip
  logo_apply: false # dry run by default: report which logos the updater would upload
  logo_revert_apply: false # dry run by default: report which logos revert would unlink
  max_changes: 500 # refuse a mode that would change more than this many items
  max_change_share: 0.25 # ...or more than this share of the candidate set; "almost everything" means the filter or mount is wrong

adopt:
  apply: false # dry run by default: produce the report, write nothing
  libraries: # Plex library names to adopt
    - Movies
    - TV Shows

scheduler:
  enabled: true # run the periodic passes (collections reconcile, drift sweep, asset cleanup, media_items prune)
  poll_seconds: 60 # how often to check whether anything is due
  collections_hours: 24 # collections reconcile cadence
  drift_days: 7 # ratings drift sweep cadence
  drift_max_age_days: 7 # re-check an item whose facts are older than this
  drift_batch_size: 500 # items enqueued per sweep; the safety valve against enqueuing everything at once
  credits_scan_days: 7 # library credits scan cadence; whole-library per run, no batch valve
  maintenance_days: 7 # Plex maintenance pass cadence
  asset_stats_days: 7 # asset-size backfill cadence; stats render rows with no recorded size
  asset_stats_batch_size: 5000 # render rows stat'ed per sweep (os.stat calls, not renders); the valve against one long walk
  cleanup_days: 7 # orphaned asset cleanup cadence
  prune_days: 7 # media_items prune cadence
  merge_days: 7 # media_items twin merge cadence
  # cleanup_apply is not a setting here -- see cleanup.apply above, which
  # already governs whether the cleanup pass writes (dry run by default)

radarr:
  enabled: false # off until base_url is set and AUTOPOSTER_RADARR_APIKEY is exported
  base_url: http://radarr.media.svc.cluster.local
  add_existing: false # register Plex movies Radarr does not know about, in place, without downloading
  plex_path: /mnt/Media # Plex mounts the library here (capital M)
  arr_path: /mnt/media # Radarr sees the same files here (lowercase) -- case-sensitive, see arr/paths.py
  quality_profile: HD Bluray + WEB
  monitor: true
  minimum_availability: announced

sonarr:
  enabled: false # off until base_url is set and AUTOPOSTER_SONARR_APIKEY is exported
  base_url: http://sonarr.media.svc.cluster.local
  add_existing: false # register Plex shows Sonarr does not know about, in place, without downloading
  plex_path: /mnt/Media
  arr_path: /mnt/media
  quality_profile: WEB-1080p
  monitor: true
  season_folder: true
  series_type: standard

tracearr:
  enabled: false # off until base_url is set and AUTOPOSTER_TRACEARR_APIKEY is exported
  base_url: http://tracearr.media.svc.cluster.local
  # api_key is deliberately not a key here -- it is AUTOPOSTER_TRACEARR_APIKEY,
  # the same posture as radarr/sonarr. Switching this on makes the
  # `chart_tracearr_movies` / `chart_tracearr_shows` presets buildable; it does
  # not switch them on, which is `collections.presets`.

arr_sync:
  enabled: true # the safety net (enqueue unrecorded Plex items) runs even when both services above are disabled
  hours: 24 # Radarr/Sonarr registration cadence
  batch_size: 500 # safety-net items enqueued per pass; same safety valve as scheduler.drift_batch_size

notifications:
  enabled: false # POST run-completion webhooks to `url`; off until pointed somewhere
  url: "" # e.g. http://n8n.n8n-prod.svc.cluster.local:5678/webhook/autoposter -- may embed a token, never logged in full
  # Payload shape (see src/autoposter/notify/payload.py for all four modes):
  #   apprise-json (default): the body Apprise's json:// scheme POSTs --
  #     {"version": "1.0", "title": ..., "message": ..., "attachments": [],
  #      "type": "success" | "failure"} -- what an Apprise-trained consumer
  #     or a `body.type === "success"` gate expects.
  #   autoposter-v1: this service's own versioned shape --
  #     {"schema": "autoposter/v1", "event": ..., "at": <ISO 8601 UTC>,
  #      "summary": ..., "detail": {...}} -- carries the full detail dict.
  #   discord: a Discord webhook embed --
  #     {"embeds": [{"title": ..., "description": ..., "color": ...,
  #      "timestamp": ..., "fields": [...]}], "allowed_mentions": {"parse": []}}
  #     -- detail becomes embed fields, and mentions are suppressed so a
  #     collection titled @everyone cannot ping a server.
  #   apprise-api: the body an Apprise API server accepts at /notify/{key} --
  #     {"title": ..., "body": ..., "type": "success" | "failure"} -- the
  #     opposite direction from apprise-json, which impersonates Apprise as a
  #     sender. tag and format are left to the server's defaults.
  mode: apprise-json
  timeout_seconds: 10 # per-attempt HTTP timeout
  retry_count: 3 # attempts before giving up; notification failure never fails the run it reports on

artwork:
  use_logo: true
  logo_language_order: [en, fi]
  logo_text_fallback: false
  # Roadmap row 38 -- per-library language order, keyed by library then art
  # kind (poster/season_poster/background/title_card). An art kind not named
  # keeps its own language_order below.
  # Example:
  #   library_language_overrides:
  #     Anime:
  #       poster: [ja, en]
  library_language_overrides: {}
  # Roadmap row 47 -- make no online provider request for any artifact. A
  # manually supplied local asset (including a picked logo) is unaffected and
  # still used. Individual art kinds can override this either way.
  disable_online_asset_fetch: false
  # Roadmap row 48 -- apply a show's SeasonTemplate/EpisodeTemplate manual
  # assets to every season poster and title card beneath it that has none of
  # its own.
  season_episode_templates: false
  # Roadmap row 44 -- draw an item's original-language title instead of the
  # localized one, where Plex carries one.
  use_original_title: false
  # Roadmap row 45 -- prefer Fanart.tv clearart over clearlogo when
  # compositing a logo onto a poster.
  use_clearart: false
  # Roadmap row 46 -- flatten every composited clearlogo to this one colour.
  # Unset leaves each logo its own colours.
  logo_flat_color: null
  output_quality: 92%

  poster:
    enabled: true
    language_order: [xx, en, fi]
    overlay_file: overlay.png
    add_overlay: true
    add_border: false
    border_color: white
    border_width: 30
    skip_local_text_add: false
    disable_online_asset_fetch: null
    skip_add_text_when_with_text: false
    text:
      font: Comfortaa-Medium.ttf
      all_caps: true
      font_color: white
      min_point_size: 83
      max_point_size: 250
      max_width: 1200
      max_height: 485
      text_offset: "+300"
      gravity: south
      line_spacing: 0
      add_text: true
      add_stroke: false
      stroke_color: black
      stroke_width: 6
      newline_on_symbols: []
      newline_words: {}

  season_poster:
    enabled: true
    language_order: [xx, en, fi]
    overlay_file: bottom-up-fade.png
    add_overlay: true
    add_border: false
    skip_local_text_add: false
    disable_online_asset_fetch: null
    skip_add_text_when_with_text: false
    text:
      font: Comfortaa-Medium.ttf
      all_caps: true
      font_color: white
      min_point_size: 100
      max_point_size: 250
      max_width: 1200
      max_height: 485
      text_offset: "+300"
      gravity: south
      add_text: true
      add_stroke: false
      newline_on_symbols: []
      newline_words: {}
    # Roadmap row 78 (Posterizarr's ShowTitleOnSeasonPosterPart). The SHOW's
    # own name, drawn one line above the season text -- a season's own Plex
    # title is "Season 2" or "Specials", so without this a season poster never
    # says which show it belongs to. Off, as upstream ships it.
    #
    # `font` is ours: the upstream part carries no font key and inherits a
    # global one. `text_offset` AND `gravity` below are IGNORED once the gate
    # is on: the block is always drawn one fitted line of the SEASON text
    # plus 10px above the SEASON block's own text_offset, at the SEASON
    # block's own gravity (render/pipeline.py's stacked_above and its caller)
    # -- that is what "stacked above the season text" means, and it is our
    # adjudication, not a transcription: upstream gives this block the same
    # +300/south as the season text and the two would overlap. Shipped at
    # +120 here, deliberately DIFFERENT from the season block's +300, so a
    # config that swapped which block's offset feeds the stacking rule would
    # draw at a visibly different position instead of matching by
    # coincidence. Both fields below become live again on the one path where
    # there is no season text to stack above -- a blanked season for this
    # show under artwork.title_card.season_name_overrides.
    #
    # Turning this on moves the season_poster art kind's render version, so
    # every season poster re-renders once through the provider ladder. Posters,
    # backgrounds and title cards are untouched. The editor's preview says
    # exactly how many that is before you commit to it.
    show_title:
      font: Comfortaa-Medium.ttf
      all_caps: true
      font_color: white
      min_point_size: 45
      max_point_size: 300
      max_width: 1900
      max_height: 500
      text_offset: "+120"
      gravity: south
      add_text: false
      add_stroke: false
      newline_on_symbols: []
      newline_words: {}

  background:
    enabled: true
    language_order: [xx, en, fi]
    overlay_file: bottom-up-fade-background.png
    add_overlay: true
    add_border: false
    skip_local_text_add: false
    disable_online_asset_fetch: null
    skip_add_text_when_with_text: false
    text:
      font: Comfortaa-Medium.ttf
      all_caps: true
      font_color: white
      min_point_size: 95
      max_point_size: 250
      max_width: 3000
      max_height: 500
      text_offset: "+200"
      gravity: south
      add_text: false
      add_stroke: false
      newline_on_symbols: []
      newline_words: {}

  title_card:
    enabled: true
    language_order: [xx, en, fi]
    overlay_file: bottom-up-fade-background.png
    add_overlay: true
    add_border: false
    season_label: Season
    episode_label: Episode
    skip_words: [TBA]
    skip_local_text_add: false
    disable_online_asset_fetch: null
    skip_add_text_when_with_text: false
    skip_cjk_titles: false
    season_name_overrides: {}
    text:
      font: Comfortaa-Medium.ttf
      all_caps: true
      font_color: white
      min_point_size: 48
      max_point_size: 140
      max_width: 2500
      max_height: 300
      # Deliberate hide idiom: a negative south-gravity offset pushes this
      # text block fully off-canvas so title cards show only the
      # season/episode line below. The captured Posterizarr log used -150,
      # which left tall glyphs peeking into frame at all three title
      # lengths tested; -400 clears the 300px caption box entirely.
      text_offset: "-400"
      gravity: south
      add_text: true
      add_stroke: false
      newline_on_symbols: []
      newline_words: {}
    episode_text:
      font: Comfortaa-Medium.ttf
      all_caps: true
      font_color: white
      min_point_size: 48
      max_point_size: 80
      max_width: 2500
      max_height: 150
      text_offset: "+100"
      gravity: south
      add_text: true
      add_stroke: false
