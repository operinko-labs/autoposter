"on":
  push:
    branches: [main]
    # Skip only what nothing verifies. Deliberately NOT listed here, because
    # the suite genuinely reads them: Dockerfile (test_assets_root asserts it
    # sets AUTOPOSTER_ASSETS_ROOT), pyproject.toml (test_declared_dependencies
    # walks src/ imports against its dependency list) and
    # config/autoposter.example.yaml (test_example_config_matches_schema
    # checks every key exists in the schema). A change to any of those must
    # still run CI. tests/test_ci_path_filters.py enforces that.
    paths-ignore: &docs_only
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    paths-ignore: *docs_only
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # tests/test_attribution_present.py hard-fails (rather than skips) a
  # missing frontend/dist only when this is set. Without it, that guard goes
  # green-with-a-skip if the "Build the frontend" step is ever removed, and
  # the TMDB/TheTVDB attribution requirement silently stops being enforced.
  # tests/test_ci_path_filters.py::test_ci_sets_the_ci_environment_variable
  # asserts this stays present.
  CI: "true"
  # Every toolchain version is an exact patch, and each is named in exactly one
  # place here so a bump is one edit. The `# renovate:` lines are what make
  # these visible to Renovate at all: it reads `uses:`, `container:` and
  # `services:` natively but not `env:` values, so without the annotation these
  # would silently stop being updated while the Dockerfile moved on.
  # datasource=docker throughout, matching the Dockerfile's `FROM python:` /
  # `FROM node:` and docker-compose.yml's `postgres:` -- the same datasource and
  # depName as those, so a Renovate group bumps every location to one string.
  # tests/test_toolchain_versions.py fails if a half-applied group leaves them
  # disagreeing.
  # renovate: datasource=docker depName=python versioning=docker
  PYTHON_VERSION: "3.14.7"
  # renovate: datasource=docker depName=node versioning=docker
  NODE_VERSION: "26.7.0"
  # renovate: datasource=docker depName=postgres versioning=docker
  POSTGRES_VERSION: "18.6"
  IMAGE_NAME: autoposter
  # The virtualenv the "Lint and test" job runs everything from, cached whole
  # between runs -- see "Restore the virtualenv". Deliberately *outside* the
  # checkout: the ImageMagick step below streams this workspace to the Docker
  # daemon as a build context, and .dockerignore excludes only
  # frontend/node_modules and frontend/dist, so a venv under the checkout would
  # add a few hundred megabytes to every one of those builds.
  VENV: /opt/ci-venv
  # Every Docker resource a run creates is suffixed with the run id, because
  # the runner hosts concurrent jobs on one shared daemon. With fixed names,
  # two overlapping runs fought over them: each began with `docker rm -f
  # ci-postgres`, so the later run killed the earlier run's database
  # mid-suite -- StaleDataErrors and connection failures that read exactly
  # like real regressions -- and a PR's image job could re-tag `autoposter:ci`
  # between a main run's build and its push, shipping the wrong image.
  PG_CONTAINER: ci-postgres-${{ github.run_id }}
  PG_NETWORK: ci-db-${{ github.run_id }}
  MIG_CONTAINER: ci-pg-${{ github.run_id }}
  MIG_NETWORK: ci-net-${{ github.run_id }}
  CI_IMAGE: autoposter:ci-${{ github.run_id }}
  DEV_IMAGE: autoposter:ci-dev-${{ github.run_id }}

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # Cache pip's wheel cache between runs, keyed on pyproject.toml --
          # the same treatment setup-node already gives npm below. Since the
          # venv cache below arrived this is the *miss* path's accelerator: on
          # a venv hit pip never runs, and on a venv miss these wheels are what
          # it installs from rather than downloading them again.
          cache: pip
          cache-dependency-path: pyproject.toml

      # The built virtualenv itself, not merely the wheels it was built from.
      # A warm pip cache still left `pip install -e ".[dev]"` to resolve the
      # dependency graph and unpack every package on every run; restoring the
      # venv skips all of that.
      #
      # The key is the interpreter patch plus pyproject.toml's hash, which is
      # the whole of what decides this venv's contents -- both the dependency
      # list and the dev extras live in that file, so any change to what gets
      # installed changes the key. `v1` is the manual escape hatch: bump it if
      # a restored venv is ever wrong in a way the key cannot see.
      #
      # Deliberately no `restore-keys:`. A near-miss would hand the job a venv
      # built for a *different* dependency set, and the run would go green
      # having tested against packages this commit does not declare -- exactly
      # the class of silent wrongness the missing-Pillow incident was. A miss
      # is meant to reinstall.
      - name: Restore the virtualenv
        id: venv
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.VENV }}
          key: v1-venv-py${{ env.PYTHON_VERSION }}-${{ hashFiles('pyproject.toml') }}

      - name: Install the package and its dev extras
        # Skipped outright on a cache hit -- that is the point of the step
        # above. The venv is created explicitly at a path this workflow names,
        # rather than installing into whatever interpreter setup-python put on
        # PATH: the job is itself a container, so the interpreter lives in the
        # runner's tool cache, and a directory that is to be cached has to be
        # one this file chose.
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv "$VENV"
          "$VENV/bin/python" -m pip install --upgrade pip
          "$VENV/bin/pip" install -e ".[dev]"

      - name: Use the virtualenv for the rest of the job
        # Everything after this -- ruff, pytest, alembic -- resolves from here.
        run: |
          echo "VIRTUAL_ENV=$VENV" >> "$GITHUB_ENV"
          echo "$VENV/bin" >> "$GITHUB_PATH"

      - name: Verify the virtualenv answers for this checkout
        # A restored venv is only ever as good as its key. If the interpreter
        # it was built against moved, or the editable install's recorded path
        # stopped resolving, every later step fails with something that reads
        # like a source error. Say it here instead, on the step whose name is
        # the diagnosis, with the fix being to bump `v1` in the key above.
        #
        # `pip install -e` records an absolute path into the workspace, so
        # importing the package also proves the cached venv points at *this*
        # checkout rather than at a stale one.
        run: |
          python -c "import autoposter; print('autoposter from', autoposter.__file__)"
          ruff --version
          pytest --version

      # Deliberately not a `services:` block. On this runner the job is itself
      # a container on the default bridge network, so a service container is
      # not reachable at localhost -- that attempt failed with 327 setup
      # errors, every one "Connect call failed ('127.0.0.1', 5432)", while the
      # service sat there reporting healthy.
      - name: Start PostgreSQL
        run: |
          # The rm covers a re-run attempt, which reuses the run id and so
          # could find attempt 1's container if its cleanup never ran. The
          # network needs the same tolerance: attempt 1's network survives a
          # cancelled cleanup too, so remove it before creating, and tolerate
          # the removal failing (it may still be attached to attempt 1's
          # not-yet-reaped container).
          docker rm -f "$PG_CONTAINER" >/dev/null 2>&1 || true
          docker network rm "$PG_NETWORK" >/dev/null 2>&1 || true
          docker network create "$PG_NETWORK" >/dev/null 2>&1 || true
          # Succeeds when the job is a container; harmlessly fails when it is
          # not, in which case the published port below is the route instead.
          docker network connect "$PG_NETWORK" "$(hostname)" >/dev/null 2>&1 || true
          # An ephemeral host port rather than 5432:5432 -- a fixed published
          # port is one more thing two concurrent runs cannot both hold.
          docker run -d --name "$PG_CONTAINER" --network "$PG_NETWORK" \
            -p 127.0.0.1::5432 \
            -e POSTGRES_USER=autoposter \
            -e POSTGRES_PASSWORD=autoposter \
            -e POSTGRES_DB=autoposter \
            postgres:${{ env.POSTGRES_VERSION }}-alpine
          PG_HOST_PORT="$(docker port "$PG_CONTAINER" 5432/tcp | head -n1 | cut -d: -f2)"
          # An empty value here would silently fall back to 5432 in
          # wait_for_postgres.py -- wrong by construction under an ephemeral
          # publish, and a confusing 180s timeout on a host-mode runner.
          test -n "$PG_HOST_PORT"
          echo "PG_HOST_PORT=$PG_HOST_PORT" >> "$GITHUB_ENV"

      # Waiting on `pg_isready` inside the container was the previous attempt's
      # mistake: it probes the unix socket, while the suite connects over TCP
      # from here. During initdb the image runs a temporary server on the
      # socket only, so the socket reports ready while TCP is still refused --
      # the wait broke early on a signal that did not mean what it looked like,
      # and the very next check reported "rejecting connections".
      #
      # Wait on exactly what the tests use instead: a real asyncpg connection
      # over TCP, from this job, to the host the tests will be handed. Nothing
      # is inferred from a proxy signal.
      - name: Wait for PostgreSQL and resolve its host
        run: python .forgejo/scripts/wait_for_postgres.py

      - name: Show PostgreSQL logs if it never came up
        if: failure()
        run: docker logs "$PG_CONTAINER" || true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # tests/test_attribution_present.py asserts against frontend/dist,
      # because that is the artefact the container serves: a component that
      # nothing routes to still passes a component test, and this branch
      # shipped exactly that -- main.tsx never imported App, so the whole UI
      # was absent from the bundle while every check stayed green. Without
      # this step that guard would skip, and the provider attribution TMDB's
      # and TheTVDB's terms require would go unverified.
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Test the frontend
        working-directory: frontend
        run: npm test

      - name: Lint
        run: ruff check src tests

      - name: Test
        # Everything except the ImageMagick-gated tests, which this runner
        # cannot satisfy and which the next step runs somewhere that can. They
        # are deselected rather than left to skip because `CI` is set above,
        # and tests/conftest.py's `imagemagick` fixture fails rather than skips
        # when it is -- so leaving them in this run would make it red here for
        # a reason that is not a defect.
        #
        # `-n auto` fans the suite out across the runner's cores. That is safe
        # only because tests/conftest.py hands each worker a database of its
        # own, derived from AUTOPOSTER_TEST_DATABASE_URL and created through
        # AUTOPOSTER_MAINTENANCE_DATABASE_URL -- both exported above by
        # .forgejo/scripts/wait_for_postgres.py. Sharing one database across
        # workers is what produced StaleDataErrors reading exactly like real
        # regressions, and is why conftest.py used to forbid this outright.
        #
        # `--dist loadgroup` rather than plain `load`, so that a test which
        # cannot be separated from its neighbours can be kept with them by
        # marking it `@pytest.mark.xdist_group(...)`. Nothing carries that
        # marker today; the flag is what makes adding one sufficient.
        #
        # The ImageMagick step below stays serial. It is eleven tests against
        # one private database, so there is nothing to gain and a second
        # per-worker database scheme to get wrong.
        run: pytest tests/ -q -m "not imagemagick" -n auto --dist loadgroup

      # The tests that prove poster output is byte-identical to the tool this
      # service replaces had, until this step, never run in CI at all: they
      # gate on a `magick` binary, no runner has one, and they skipped in
      # silence while the job went green. `apt-get install imagemagick` does
      # not fix that -- Ubuntu ships ImageMagick 6, whose binary is `convert`,
      # so `shutil.which("magick")` stays None and the gate stays shut. The
      # image job below does have a Q16-HDRI build but never invokes pytest.
      # The cost of that gap was real: `FakePlex` sat here without a
      # `fetch_item` method until it was found by accident.
      #
      # So they run in the Dockerfile's own `dev` stage, which inherits
      # `pybase` -- exactly the ImageMagick packages the shipped image
      # carries. Alpine's is the Q16-HDRI build byte-equality depends on; a
      # plain Q16 renders the same source 0.077% differently. Building the
      # stage here rather than `apk add` + `pip install` into a bare
      # python:alpine (the previous shape) means the daemon's layer cache
      # answers for both on most runs: the ImageMagick layer survives until
      # the base image moves, and the pip install layer until pyproject.toml
      # or src/ change. A plain `docker build`, not docker/build-push-action:
      # tests/test_ci_path_filters.py forbids that action a `target:` so the
      # image job can never quietly ship a non-final stage.
      #
      # `CI=true` is passed in on purpose. It is what makes the fixture fail
      # instead of skip, so if this step ever stops providing a `magick` the
      # run goes red rather than quietly passing having rendered nothing.
      # tests/test_ci_path_filters.py asserts both that flag and this step.
      - name: Test the ImageMagick-gated poster parity
        run: |
          # A private database. The run above rebuilds the schema in
          # `autoposter` and truncates between tests; sharing it with a second
          # suite is what produced a StaleDataError when this was tried.
          # Separate `psql` invocations because CREATE DATABASE cannot run
          # inside a transaction block.
          docker exec "$PG_CONTAINER" psql -U autoposter -d postgres \
            -c 'DROP DATABASE IF EXISTS autoposter_magick'
          docker exec "$PG_CONTAINER" psql -U autoposter -d postgres \
            -c 'CREATE DATABASE autoposter_magick OWNER autoposter'

          # `docker build` streams this checkout to the daemon over the API,
          # so it works where a bind mount would not: this job is itself a
          # container, and `-v "$PWD:/repo"` would ask the host's daemon for
          # a path that exists only in here.
          docker build --target dev -t "$DEV_IMAGE" .

          # `docker create` + `docker cp` for the parts the dev stage does
          # not carry, for the same reason. pyproject.toml and src/ are
          # already in the image at /app -- the build above just put this
          # checkout's copies there -- and the editable install resolves
          # `assets_root()` two levels up from /app/src, so the tree lands
          # exactly where docker-compose.yml's bind mount puts it locally.
          #
          # -v so the report names every test that ran: a reviewer can see
          # these executed rather than inferring it from a count. A marker
          # matching nothing exits 5, which fails this step -- deleting
          # the marker cannot quietly empty this run either.
          cid=$(docker create --network "$PG_NETWORK" -w /app \
            -e CI=true \
            -e AUTOPOSTER_TEST_DATABASE_URL="postgresql+asyncpg://autoposter:autoposter@${PG_CONTAINER}:5432/autoposter_magick" \
            -e AUTOPOSTER_MAINTENANCE_DATABASE_URL="postgresql://autoposter:autoposter@${PG_CONTAINER}:5432/postgres" \
            "$DEV_IMAGE" python -m pytest tests/ -v -m imagemagick)
          for path in tests config assets; do
            docker cp "$path" "${cid}:/app/${path}"
          done
          # `|| status=$?` rather than reading $? afterwards: the runner's
          # shell exits on error, so a failing pytest would abort this script
          # before the container could be removed.
          status=0
          docker start -a "$cid" || status=$?
          docker rm -f "$cid" >/dev/null
          exit $status

      # Per-run names do not clean themselves up: without this, a persistent
      # runner accumulates one database container and network per run.
      - name: Remove PostgreSQL
        if: always()
        run: |
          docker rm -f "$PG_CONTAINER" >/dev/null 2>&1 || true
          docker network disconnect "$PG_NETWORK" "$(hostname)" >/dev/null 2>&1 || true
          docker network rm "$PG_NETWORK" >/dev/null 2>&1 || true
          # Untag only: BuildKit's layer cache is what makes the next run's
          # dev build fast, and it survives the tag's removal.
          docker rmi "$DEV_IMAGE" >/dev/null 2>&1 || true

  image:
    name: Build, verify and push the image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate image tag
        id: gen_tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          # The same sha is handed to the build below as GIT_SHA, which the
          # Dockerfile turns into AUTOPOSTER_VERSION=sha-<it>. Both come from
          # this one line so the tag the image is pushed under and the version
          # it reports over /api/version cannot drift apart.
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build the image locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.CI_IMAGE }}
          # Stamps the image with its own registry tag -- see the Dockerfile's
          # ARG GIT_SHA. It is the last layer, so a new sha rebuilds nothing
          # but that ENV; the cache below still covers everything above it.
          build-args: |
            GIT_SHA=${{ steps.gen_tag.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A successful build proves nothing about whether the application can
      # start. Pillow was imported at module scope by the render pipeline for
      # two phases while missing from pyproject.toml: the image built cleanly
      # every time and the container then died on ModuleNotFoundError before
      # serving a request. Importing the entrypoint inside the built image is
      # the check that would have caught it.
      - name: Verify the application imports inside the image
        run: |
          docker run --rm ${{ env.CI_IMAGE }} \
            python -c "import autoposter.main; import autoposter.app; print('entrypoint imports OK')"

      - name: Verify ImageMagick is a Q16-HDRI build
        # Poster output is byte-identical to the tool being replaced only on a
        # Q16-HDRI build; a plain Q16 renders the same source 0.077% differently.
        run: |
          # Captured rather than piped into `grep -q`. That form failed with
          # "write /dev/stdout: broken pipe": grep exits the moment it
          # matches, docker gets EPIPE writing the rest, and the runner's
          # shell has pipefail set, so the pipeline fails even though the
          # match succeeded. It is a race, which is why it passed several
          # runs before biting. No pipe, no race.
          version=$(docker run --rm ${{ env.CI_IMAGE }} magick -version)
          echo "$version"
          case "$version" in
            *HDRI*) echo "Q16-HDRI confirmed" ;;
            *) echo "not a Q16-HDRI build; poster parity depends on it" >&2; exit 1 ;;
          esac

      - name: Verify the bundled assets are present and reachable
        # The package installs to site-packages while assets are copied to
        # /app/assets, so they cannot be found relative to the module files.
        # AUTOPOSTER_ASSETS_ROOT is what bridges that, and it is set in the image.
        run: |
          docker run --rm ${{ env.CI_IMAGE }} python -c "
          from autoposter.assets import assets_root
          from autoposter.badges.spec import BADGES
          from autoposter.badges.values import resolution_image, MediaInfo
          root = assets_root()
          assert (root / 'badges' / 'fonts' / 'Inter-Bold.ttf').is_file(), root
          assert (root / 'badges' / 'languages.json').is_file(), root
          assert (root / 'collections' / 'content_rating_cs.json').is_file(), root
          info = MediaInfo('1080', 'eac3', 6, 1, (), frozenset(), None, None, None)
          assert resolution_image(info) == '1080p'
          print('assets reachable at', root, 'with', len(BADGES), 'badges defined')
          "

      - name: Verify the web UI is inside the image and actually served
        # Same class of failure as the entrypoint-import check above, one layer
        # further out. If the Node stage were dropped, AUTOPOSTER_SPA_DIST were
        # wrong, or dist/ landed somewhere else, the API would still start and
        # every probe -- /healthz, /metrics, the import check -- would pass,
        # while a browser got a 404 at `/`. Nothing else in this job looks at
        # the UI at all.
        #
        # Asserting index.html exists on disk is not enough: `mount_spa` also
        # has to be reachable, and a bundle whose JS is missing is a blank page
        # behind a 200. So this drives the real ASGI app and follows the shell
        # to the script it references, checking the content type as
        # tests/test_attribution_present.py does -- a path the /assets mount
        # does not claim comes back as HTML with a 200, which asserting on the
        # status code alone would not catch.
        #
        # TMDB's required notice is checked here as well as in
        # tests/test_attribution_present.py, because that suite reads the
        # `frontend/dist` the *runner* built at "Build the frontend" -- same
        # source and same pinned Node, so equivalent in practice, but still one
        # artefact standing in for another. This job already has each script's
        # body in hand, so proving the licence condition against the bundle
        # that ships costs one assertion.
        run: |
          docker run --rm ${{ env.CI_IMAGE }} python -c "
          import asyncio, os, re
          from pathlib import Path
          from fastapi import FastAPI
          from httpx import ASGITransport, AsyncClient
          from autoposter.api.spa import mount_spa, spa_dist

          # Verbatim from TMDB's attribution requirements, and identical to
          # TMDB_NOTICE in tests/test_attribution_present.py.
          notice = ('This product uses TMDB and the TMDB APIs but is not '
                    'endorsed, certified, or otherwise approved by TMDB.')

          dist = spa_dist()
          assert dist == Path(os.environ['AUTOPOSTER_SPA_DIST']), dist
          assert (dist / 'index.html').is_file(), f'no SPA build at {dist}'

          app = FastAPI()
          mount_spa(app, dist)

          async def main():
              transport = ASGITransport(app=app)
              async with AsyncClient(transport=transport, base_url='http://image') as client:
                  index = await client.get('/')
                  assert index.status_code == 200, index.status_code
                  assert index.headers['content-type'].startswith('text/html'), index.headers
                  scripts = re.findall(r'[\"\'](/assets/[^\"\']+\.js)[\"\']', index.text)
                  assert scripts, f'the shell references no bundled script: {index.text!r}'
                  served = [index.text]
                  for path in scripts:
                      asset = await client.get(path)
                      assert asset.status_code == 200, f'{path}: {asset.status_code}'
                      content_type = asset.headers['content-type']
                      assert not content_type.startswith('text/html'), (
                          f'{path} was answered with the SPA shell, not the file'
                      )
                      served.append(asset.text)
                  assert any(notice in text for text in served), (
                      'the image serves a bundle without TMDB required notice, '
                      'which their terms make a condition of using their API. '
                      'Either the Settings page was reworded or nothing routes '
                      'to it in the bundle this image ships'
                  )
                  print('SPA served from', dist, 'with', len(scripts), 'script(s)')

          asyncio.run(main())
          "

      - name: Verify migrations apply to an empty database
        # The container runs `alembic upgrade head` on startup, so a migration
        # that cannot apply is a failure to boot, not a deferred problem.
        run: |
          docker network create "$MIG_NETWORK"
          docker run -d --name "$MIG_CONTAINER" --network "$MIG_NETWORK" \
            -e POSTGRES_USER=autoposter -e POSTGRES_PASSWORD=autoposter \
            -e POSTGRES_DB=autoposter postgres:${{ env.POSTGRES_VERSION }}-alpine
          # Probe over TCP from a peer container, not with `docker exec
          # pg_isready`: that checks the unix socket, which reports ready
          # while initdb's temporary server is up and TCP is still refused.
          # alembic below connects over TCP, so wait on that.
          ready=0
          for i in $(seq 1 60); do
            if docker run --rm --network "$MIG_NETWORK" postgres:${{ env.POSTGRES_VERSION }}-alpine                  pg_isready -h "$MIG_CONTAINER" -p 5432 -U autoposter >/dev/null 2>&1; then
              ready=$((ready + 1))
            else
              ready=0
            fi
            if [ "$ready" -ge 2 ]; then break; fi
            sleep 2
          done
          if [ "$ready" -lt 2 ]; then
            echo "PostgreSQL never accepted TCP connections" >&2
            docker logs "$MIG_CONTAINER" || true
            exit 1
          fi
          docker run --rm --network "$MIG_NETWORK" \
            -e AUTOPOSTER_DATABASE_URL="postgresql+asyncpg://autoposter:autoposter@${MIG_CONTAINER}:5432/autoposter" \
            ${{ env.CI_IMAGE }} alembic upgrade head
          # alembic runs quietly in the image, so exit 0 alone is also what
          # "did nothing at all" would look like. Assert on the effect.
          COUNT_SQL="select count(*) from information_schema.tables where table_schema='public'"
          TABLES=$(docker exec "$MIG_CONTAINER" psql -U autoposter -d autoposter -tAc "$COUNT_SQL")
          echo "tables after migration: ${TABLES}"
          test "${TABLES}" -ge 10 || {
            echo "migrations exited 0 but created ${TABLES} tables, expected >= 10" >&2
            exit 1
          }

      # Scan before publishing, not after. The first push landed an image
      # Harbor then flagged with three vulnerabilities -- all of them from
      # pip's vendored dependency manifest rather than anything the
      # application imports. Failing here keeps that class of thing out of
      # the registry instead of discovering it in the UI afterwards.
      - name: Scan the image for vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock             aquasec/trivy:0.70.0 image --quiet --scanners vuln             --severity MEDIUM,HIGH,CRITICAL --no-progress             ${{ env.CI_IMAGE }}
          # Medium findings are reported above but do not block; anything
          # HIGH or CRITICAL fails the job and so is never pushed.
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock             aquasec/trivy:0.70.0 image --quiet --scanners vuln             --severity HIGH,CRITICAL --exit-code 1 --no-progress             ${{ env.CI_IMAGE }}

      - name: Resolve Harbor registry host
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "REGISTRY=$(echo "${{ secrets.HARBOR_URL }}" | sed -E 's#^[a-zA-Z]+://##; s#/+$##')" >> "$GITHUB_ENV"
          echo "IMAGE_PREFIX=$(echo "${{ secrets.HARBOR_URL }}" | sed -E 's#^[a-zA-Z]+://##; s#/+$##')/operinko-labs" >> "$GITHUB_ENV"

      - name: Log in to Harbor
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # The image pushed is the exact one the checks above ran against --
      # re-building here could produce a different one.
      - name: Push the verified image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          TAG="${{ steps.gen_tag.outputs.tag }}"
          TARGET="${IMAGE_PREFIX}/${{ env.IMAGE_NAME }}"
          docker tag ${{ env.CI_IMAGE }} "${TARGET}:${TAG}"
          docker tag ${{ env.CI_IMAGE }} "${TARGET}:latest"
          docker push "${TARGET}:${TAG}"
          docker push "${TARGET}:latest"
          echo "pushed ${TARGET}:${TAG} and ${TARGET}:latest"

      # Per-run names do not clean themselves up, and this also covers the
      # failure paths -- a failing alembic used to leave ci-pg and ci-net
      # behind for the next run to trip over. Untagging the run's image
      # leaves BuildKit's layer cache intact for the next build.
      - name: Remove the migration database and the run's image tag
        if: always()
        run: |
          docker rm -f "$MIG_CONTAINER" >/dev/null 2>&1 || true
          docker network rm "$MIG_NETWORK" >/dev/null 2>&1 || true
          docker rmi ${{ env.CI_IMAGE }} >/dev/null 2>&1 || true
