"on":
  push:
    branches: [main]
    # Skip only what nothing verifies. Deliberately NOT listed here, because
    # the suite genuinely reads them: Dockerfile (test_assets_root asserts it
    # sets AUTOPOSTER_ASSETS_ROOT), pyproject.toml (test_declared_dependencies
    # walks src/ imports against its dependency list) and
    # config/autoposter.example.yaml (test_example_config_matches_schema
    # checks every key exists in the schema). A change to any of those must
    # still run CI. tests/test_ci_path_filters.py enforces that.
    paths-ignore: &docs_only
      - 'docs/**'
      - '**/*.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    paths-ignore: *docs_only
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # tests/test_attribution_present.py hard-fails (rather than skips) a
  # missing frontend/dist only when this is set. Without it, that guard goes
  # green-with-a-skip if the "Build the frontend" step is ever removed, and
  # the TMDB/TheTVDB attribution requirement silently stops being enforced.
  # tests/test_ci_path_filters.py::test_ci_sets_the_ci_environment_variable
  # asserts this stays present.
  CI: "true"
  PYTHON_VERSION: "3.13"
  IMAGE_NAME: autoposter

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the package and its dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Deliberately not a `services:` block. On this runner the job is itself
      # a container on the default bridge network, so a service container is
      # not reachable at localhost -- that attempt failed with 327 setup
      # errors, every one "Connect call failed ('127.0.0.1', 5432)", while the
      # service sat there reporting healthy.
      - name: Start PostgreSQL
        run: |
          docker rm -f ci-postgres >/dev/null 2>&1 || true
          docker network create ci-db >/dev/null 2>&1 || true
          # Succeeds when the job is a container; harmlessly fails when it is
          # not, in which case the published port below is the route instead.
          docker network connect ci-db "$(hostname)" >/dev/null 2>&1 || true
          docker run -d --name ci-postgres --network ci-db -p 5432:5432 \
            -e POSTGRES_USER=autoposter \
            -e POSTGRES_PASSWORD=autoposter \
            -e POSTGRES_DB=autoposter \
            postgres:18-alpine

      # Waiting on `pg_isready` inside the container was the previous attempt's
      # mistake: it probes the unix socket, while the suite connects over TCP
      # from here. During initdb the image runs a temporary server on the
      # socket only, so the socket reports ready while TCP is still refused --
      # the wait broke early on a signal that did not mean what it looked like,
      # and the very next check reported "rejecting connections".
      #
      # Wait on exactly what the tests use instead: a real asyncpg connection
      # over TCP, from this job, to the host the tests will be handed. Nothing
      # is inferred from a proxy signal.
      - name: Wait for PostgreSQL and resolve its host
        run: python .forgejo/scripts/wait_for_postgres.py

      - name: Show PostgreSQL logs if it never came up
        if: failure()
        run: docker logs ci-postgres || true

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # tests/test_attribution_present.py asserts against frontend/dist,
      # because that is the artefact the container serves: a component that
      # nothing routes to still passes a component test, and this branch
      # shipped exactly that -- main.tsx never imported App, so the whole UI
      # was absent from the bundle while every check stayed green. Without
      # this step that guard would skip, and the provider attribution TMDB's
      # and TheTVDB's terms require would go unverified.
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Test the frontend
        working-directory: frontend
        run: npm test

      - name: Lint
        run: ruff check src tests

      - name: Test
        # The byte-identical poster test skips unless ImageMagick is a Q16-HDRI
        # build, which the runner's is not. That path is covered in the image
        # job below, which does have one.
        run: pytest tests/ -q

  image:
    name: Build, verify and push the image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate image tag
        id: gen_tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build the image locally
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A successful build proves nothing about whether the application can
      # start. Pillow was imported at module scope by the render pipeline for
      # two phases while missing from pyproject.toml: the image built cleanly
      # every time and the container then died on ModuleNotFoundError before
      # serving a request. Importing the entrypoint inside the built image is
      # the check that would have caught it.
      - name: Verify the application imports inside the image
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:ci \
            python -c "import autoposter.main; import autoposter.app; print('entrypoint imports OK')"

      - name: Verify ImageMagick is a Q16-HDRI build
        # Poster output is byte-identical to the tool being replaced only on a
        # Q16-HDRI build; a plain Q16 renders the same source 0.077% differently.
        run: |
          # Captured rather than piped into `grep -q`. That form failed with
          # "write /dev/stdout: broken pipe": grep exits the moment it
          # matches, docker gets EPIPE writing the rest, and the runner's
          # shell has pipefail set, so the pipeline fails even though the
          # match succeeded. It is a race, which is why it passed several
          # runs before biting. No pipe, no race.
          version=$(docker run --rm ${{ env.IMAGE_NAME }}:ci magick -version)
          echo "$version"
          case "$version" in
            *HDRI*) echo "Q16-HDRI confirmed" ;;
            *) echo "not a Q16-HDRI build; poster parity depends on it" >&2; exit 1 ;;
          esac

      - name: Verify the bundled assets are present and reachable
        # The package installs to site-packages while assets are copied to
        # /app/assets, so they cannot be found relative to the module files.
        # AUTOPOSTER_ASSETS_ROOT is what bridges that, and it is set in the image.
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:ci python -c "
          from autoposter.assets import assets_root
          from autoposter.badges.spec import BADGES
          from autoposter.badges.values import resolution_image, MediaInfo
          root = assets_root()
          assert (root / 'badges' / 'fonts' / 'Inter-Bold.ttf').is_file(), root
          assert (root / 'badges' / 'languages.json').is_file(), root
          assert (root / 'collections' / 'content_rating_cs.json').is_file(), root
          info = MediaInfo('1080', 'eac3', 6, 1, (), frozenset(), None, None, None)
          assert resolution_image(info) == '1080p'
          print('assets reachable at', root, 'with', len(BADGES), 'badges defined')
          "

      - name: Verify the web UI is inside the image and actually served
        # Same class of failure as the entrypoint-import check above, one layer
        # further out. If the Node stage were dropped, AUTOPOSTER_SPA_DIST were
        # wrong, or dist/ landed somewhere else, the API would still start and
        # every probe -- /healthz, /metrics, the import check -- would pass,
        # while a browser got a 404 at `/`. Nothing else in this job looks at
        # the UI at all.
        #
        # Asserting index.html exists on disk is not enough: `mount_spa` also
        # has to be reachable, and a bundle whose JS is missing is a blank page
        # behind a 200. So this drives the real ASGI app and follows the shell
        # to the script it references, checking the content type as
        # tests/test_attribution_present.py does -- a path the /assets mount
        # does not claim comes back as HTML with a 200, which asserting on the
        # status code alone would not catch.
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:ci python -c "
          import asyncio, os, re
          from pathlib import Path
          from fastapi import FastAPI
          from httpx import ASGITransport, AsyncClient
          from autoposter.api.spa import mount_spa, spa_dist

          dist = spa_dist()
          assert dist == Path(os.environ['AUTOPOSTER_SPA_DIST']), dist
          assert (dist / 'index.html').is_file(), f'no SPA build at {dist}'

          app = FastAPI()
          mount_spa(app, dist)

          async def main():
              transport = ASGITransport(app=app)
              async with AsyncClient(transport=transport, base_url='http://image') as client:
                  index = await client.get('/')
                  assert index.status_code == 200, index.status_code
                  assert index.headers['content-type'].startswith('text/html'), index.headers
                  scripts = re.findall(r'[\"\'](/assets/[^\"\']+\.js)[\"\']', index.text)
                  assert scripts, f'the shell references no bundled script: {index.text!r}'
                  for path in scripts:
                      asset = await client.get(path)
                      assert asset.status_code == 200, f'{path}: {asset.status_code}'
                      content_type = asset.headers['content-type']
                      assert not content_type.startswith('text/html'), (
                          f'{path} was answered with the SPA shell, not the file'
                      )
                  print('SPA served from', dist, 'with', len(scripts), 'script(s)')

          asyncio.run(main())
          "

      - name: Verify migrations apply to an empty database
        # The container runs `alembic upgrade head` on startup, so a migration
        # that cannot apply is a failure to boot, not a deferred problem.
        run: |
          docker network create ci-net
          docker run -d --name ci-pg --network ci-net \
            -e POSTGRES_USER=autoposter -e POSTGRES_PASSWORD=autoposter \
            -e POSTGRES_DB=autoposter postgres:18-alpine
          # Probe over TCP from a peer container, not with `docker exec
          # pg_isready`: that checks the unix socket, which reports ready
          # while initdb's temporary server is up and TCP is still refused.
          # alembic below connects over TCP, so wait on that.
          ready=0
          for i in $(seq 1 60); do
            if docker run --rm --network ci-net postgres:18-alpine                  pg_isready -h ci-pg -p 5432 -U autoposter >/dev/null 2>&1; then
              ready=$((ready + 1))
            else
              ready=0
            fi
            if [ "$ready" -ge 2 ]; then break; fi
            sleep 2
          done
          if [ "$ready" -lt 2 ]; then
            echo "PostgreSQL never accepted TCP connections" >&2
            docker logs ci-pg || true
            docker rm -f ci-pg; docker network rm ci-net
            exit 1
          fi
          docker run --rm --network ci-net \
            -e AUTOPOSTER_DATABASE_URL=postgresql+asyncpg://autoposter:autoposter@ci-pg:5432/autoposter \
            ${{ env.IMAGE_NAME }}:ci alembic upgrade head
          # alembic runs quietly in the image, so exit 0 alone is also what
          # "did nothing at all" would look like. Assert on the effect.
          COUNT_SQL="select count(*) from information_schema.tables where table_schema='public'"
          TABLES=$(docker exec ci-pg psql -U autoposter -d autoposter -tAc "$COUNT_SQL")
          echo "tables after migration: ${TABLES}"
          docker rm -f ci-pg
          docker network rm ci-net
          test "${TABLES}" -ge 10 || {
            echo "migrations exited 0 but created ${TABLES} tables, expected >= 10" >&2
            exit 1
          }

      # Scan before publishing, not after. The first push landed an image
      # Harbor then flagged with three vulnerabilities -- all of them from
      # pip's vendored dependency manifest rather than anything the
      # application imports. Failing here keeps that class of thing out of
      # the registry instead of discovering it in the UI afterwards.
      - name: Scan the image for vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock             aquasec/trivy:0.70.0 image --quiet --scanners vuln             --severity MEDIUM,HIGH,CRITICAL --no-progress             ${{ env.IMAGE_NAME }}:ci
          # Medium findings are reported above but do not block; anything
          # HIGH or CRITICAL fails the job and so is never pushed.
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock             aquasec/trivy:0.70.0 image --quiet --scanners vuln             --severity HIGH,CRITICAL --exit-code 1 --no-progress             ${{ env.IMAGE_NAME }}:ci

      - name: Resolve Harbor registry host
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "REGISTRY=$(echo "${{ secrets.HARBOR_URL }}" | sed -E 's#^[a-zA-Z]+://##; s#/+$##')" >> "$GITHUB_ENV"
          echo "IMAGE_PREFIX=$(echo "${{ secrets.HARBOR_URL }}" | sed -E 's#^[a-zA-Z]+://##; s#/+$##')/operinko-labs" >> "$GITHUB_ENV"

      - name: Log in to Harbor
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # The image pushed is the exact one the checks above ran against --
      # re-building here could produce a different one.
      - name: Push the verified image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          TAG="${{ steps.gen_tag.outputs.tag }}"
          TARGET="${IMAGE_PREFIX}/${{ env.IMAGE_NAME }}"
          docker tag ${{ env.IMAGE_NAME }}:ci "${TARGET}:${TAG}"
          docker tag ${{ env.IMAGE_NAME }}:ci "${TARGET}:latest"
          docker push "${TARGET}:${TAG}"
          docker push "${TARGET}:latest"
          echo "pushed ${TARGET}:${TAG} and ${TARGET}:latest"
